<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>EVOLVE — Artificial Life</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#e9f4ed;font-family:system-ui,-apple-system,sans-serif}body{touch-action:none}#world{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:14px;pointer-events:none}.brand{font-size:11px;letter-spacing:.25em;opacity:.65}.stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.pill{background:#0d1b16cc;border:1px solid #ffffff12;border-radius:999px;padding:7px 10px;font-size:12px;backdrop-filter:blur(10px)}#controls{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}button{border:1px solid #ffffff18;background:#10221bcc;color:#eef8f0;border-radius:14px;padding:12px 13px;font-size:13px;font-weight:650;backdrop-filter:blur(12px)}button:active{transform:scale(.97)}#speed{flex:1}</style></head><body><canvas id="world"></canvas><div id="hud"><div class="brand">EVOLVE / ARTIFICIAL LIFE</div><div class="stats"><div class="pill">Generation <b id="gen">0</b></div><div class="pill">Population <b id="pop">0</b></div><div class="pill">Species <b id="species">1</b></div></div></div><div id="controls"><button id="pause">Ⅱ</button><button id="food">+ Nahrung</button><button id="water">+ Wasser</button><button id="speed">1×</button></div><script>const c=document.getElementById('world'),x=c.getContext('2d');let W,H,D,generation=0,paused=false,speed=1,last=performance.now();const foods=[],waters=[],creatures=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=()=>Math.random();function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function food(a=rand()*W,b=rand()*H){foods.push({x:a,y:b,e:1,r:2+rand()*2})}function water(a=rand()*W,b=rand()*H){waters.push({x:a,y:b,r:25+rand()*35})}function genome(p){if(!p)return{size:.25+rand()*.35,speed:.35+rand()*.45,sense:.25+rand()*.55,metabolism:.35+rand()*.5,fertility:.3+rand()*.5,heat:.35+rand()*.5,aggression:rand(),explore:.03+rand()*.12};let q={...p};for(const k in q)if(rand()<.16)q[k]=clamp(q[k]+(rand()-.5)*.22,0,1);return q}function creature(p,a=rand()*W,b=rand()*H){let q=genome(p);creatures.push({x:a,y:b,vx:rand()-.5,vy:rand()-.5,g:q,e:.55+rand()*.35,age:0,maxAge:900+q.size*700,cooldown:100+rand()*150,hue:115+95*q.heat})}for(let i=0;i<120;i++)creature();for(let i=0;i<180;i++)food();for(let i=0;i<4;i++)water();function nearest(A,z,r){let b=null,bd=r*r;for(const o of A){let dx=o.x-z.x,dy=o.y-z.y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=o}}return b}function update(dt){if(paused)return;for(let s=0;s<Math.max(1,Math.floor(speed));s++){for(const z of creatures){z.age++;z.cooldown--;let q=z.g;z.e-=.00075+q.size*.0012+q.sense*.00045+(Math.abs(z.vx)+Math.abs(z.vy))*(.0007+q.size*.0015)+Math.abs(.55-q.heat)*.0008*(.5+q.size);let f=nearest(foods,z,70+q.sense*100);if(f){let dx=f.x-z.x,dy=f.y-z.y,d=Math.hypot(dx,dy)||1;z.vx+=dx/d*(.002+q.sense*.006);z.vy+=dy/d*(.002+q.sense*.006);if(d<7){z.e+=.1;f.e-=.35;if(f.e<=0)foods.splice(foods.indexOf(f),1)}}else{z.vx+=(rand()-.5)*q.explore*.02;z.vy+=(rand()-.5)*q.explore*.02}let w=nearest(waters,z,80);if(w){let dx=w.x-z.x,dy=w.y-z.y,d=Math.hypot(dx,dy)||1;z.vx+=dx/d*.001*q.sense;z.vy+=dy/d*.001*q.sense;if(d<w.r)z.e+=.0009}let m=.25+q.speed*.75,v=Math.hypot(z.vx,z.vy);if(v>m){z.vx*=m/v;z.vy*=m/v}z.x+=z.vx*dt;z.y+=z.vy*dt;if(z.x<0||z.x>W)z.vx*=-1;if(z.y<0||z.y>H)z.vy*=-1;z.x=clamp(z.x,0,W);z.y=clamp(z.y,0,H);if(z.e>.88&&z.age>180&&z.cooldown<=0&&creatures.length<500){z.e*=.48;z.cooldown=220+rand()*250;creature(z.g,z.x+rand()*12-6,z.y+rand()*12-6)}}if(rand()<.045*speed&&foods.length<350){let w=waters[(rand()*waters.length)|0];w?food(w.x+(rand()-.5)*w.r*2,w.y+(rand()-.5)*w.r*2):food()}for(let i=creatures.length-1;i>=0;i--){let z=creatures[i];if(z.e<=0||z.age>z.maxAge||rand()<.00005)creatures.splice(i,1)}if(creatures.length<20)for(let i=0;i<40;i++)creature();generation++}}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#07100d';x.fillRect(0,0,W,H);for(const w of waters){x.beginPath();x.arc(w.x,w.y,w.r,0,Math.PI*2);x.fillStyle='rgba(50,130,150,.10)';x.fill()}for(const f of foods){x.beginPath();x.arc(f.x,f.y,f.r,0,Math.PI*2);x.fillStyle='rgba(145,210,120,.7)';x.fill()}for(const z of creatures){let r=2.2+z.g.size*4;x.beginPath();x.arc(z.x,z.y,r,0,Math.PI*2);x.fillStyle=`hsl(${z.hue} 45% ${45+z.e*25}%)`;x.fill()}document.getElementById('gen').textContent=generation.toLocaleString('de-DE');document.getElementById('pop').textContent=creatures.length;document.getElementById('species').textContent=new Set(creatures.map(z=>Math.round(z.g.size*5)+'-'+Math.round(z.g.speed*5)+'-'+Math.round(z.g.heat*5))).size}function loop(t){let dt=Math.min(2,(t-last)/16.67);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);pause.onclick=()=>{paused=!paused;pause.textContent=paused?'▶':'Ⅱ'};food.onclick=()=>{for(let i=0;i<30;i++)food(W/2+(rand()-.5)*180,H/2+(rand()-.5)*180)};water.onclick=()=>water(W/2+(rand()-.5)*180,H/2+(rand()-.5)*180);speed.onclick=()=>{speed=speed===1?3:speed===3?10:1;speed.textContent=speed+'×'};c.addEventListener('pointerdown',e=>food(e.clientX,e.clientY));</script></body></html>
