EARTHQUAKES <b id="eq">—</b></div><div>STORMS <b id="st">—</b></div><div class="legend"><span class="dot" style="background:#ff4038"></span>Earthquake<br><span class="dot" style="background:#a84cff"></span>Storm<br><span class="dot" style="background:#ffd33d"></span>Flight<br><span class="dot" style="background:#9feaff"></span>Satellite</div></div><div class="layers"><button class="layer on" data-x="b">BORDERS</button><button class="layer on" data-x="w">WEATHER</button><button class="layer on" data-x="e">QUAKES</button><button class="layer on" data-x="g">GRID</button></div><div class="bottom"><div class="nav"><button class="b" id="reset">↻</button><button class="b" id="sound">♪</button></div><div class="scale"><span id="mode">PLANET</span><br><small id="z">0.8×</small></div></div><div class="hint">DRAG · DREHEN &nbsp; PINCH · ZOOM &nbsp; TAP · ENTDECKEN</div><div id="info" class="info"></div></div><script type="module">import*as THREE from'three';const $=s=>document.querySelector(s),c=$('#c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight,false);const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);cam.position.z=3.15;const earth=new THREE.Group();scene.add(earth);let zoom=.72,target=.72,drag=null,vx=0,vy=0,pinch=0;function P(lat,lon,rad=1){let a=lat*Math.PI/180,b=lon*Math.PI/180;return new THREE.Vector3(Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)).multiplyScalar(rad)}function stars(){let a=[];for(let i=0;i<2200;i++){let t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);a.push(18*Math.sin(p)*Math.cos(t),18*Math.cos(p),18*Math.sin(p)*Math.sin(t))}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xe4f4ff,size:.018,transparent:true,opacity:.8})))}stars();function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function brush(ctx,x,y,rx,ry,col,n=20){ctx.fillStyle=col;for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,rr=Math.random(),px=x+Math.cos(a)*rx*rr,py=y+Math.sin(a)*ry*rr;ctx.globalAlpha=.18+.35*Math.random();ctx.beginPath();ctx.ellipse(px,py,rx*(.08+.18*Math.random()),ry*(.04+.13*Math.random()),a,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}function makeMap(){const w=2048,h=1024,cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');let bg=x.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#1d7bb0');bg.addColorStop(.5,'#08639a');bg.addColorStop(1,'#124e83');x.fillStyle=bg;x.fillRect(0,0,w,h);x.lineCap='round';x.lineJoin='round';for(let i=0;i<180;i++){let px=Math.random()*w,py=Math.random()*h;x.strokeStyle=i%2?'#55b7d1':'#0b4f80';x.globalAlpha=.22;x.lineWidth=2+Math.random()*5;x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+30+Math.random()*90,py-10+Math.random()*30,px+80+Math.random()*130,py+Math.random()*45);x.stroke()}x.globalAlpha=1;return {cv,x,w,h}}const map=makeMap();const tex=new THREE.CanvasTexture(map.cv);tex.colorSpace=THREE.SRGBColorSpace;const mat=new THREE.MeshBasicMaterial({map:tex});const E=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),mat);earth.add(E);const borderG=new THREE.Group(),gridG=new THREE.Group(),eventG=new THREE.Group(),artG=new THREE.Group();earth.add(borderG,gridG,eventG,artG);const bm=new THREE.LineBasicMaterial({color:0x123047,transparent:true,opacity:.98}),white=new THREE.LineBasicMaterial({color:0xf8fbff,transparent:true,opacity:.9}),gm=new THREE.LineBasicMaterial({color:0xb6e7ff,transparent:true,opacity:.13});function xy(lon){return (lon+180)/360*map.w}function yy(lat){return (90-lat)/180*map.h}function paintPoly(ctx,rings,fill,stroke){ctx.beginPath();rings.forEach(r=>r.forEach((p,i)=>{let X=xy(p[0]),Y=yy(p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=5;ctx.stroke()}}function countryColor(i){let a=['#79bd4d','#65a947','#8cc65b','#e4bd57','#d99b4c','#58a879','#78b85a','#e7c46b'];return a[i%a.length]}async function borders(){try{let j=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/main/data/countries.geojson').then(x=>x.json());j.features.forEach((f,i)=>{let g=f.geometry;if(!g)return;let polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;polys.forEach(poly=>{paintPoly(map.x,poly,countryColor(i),'#17364a');poly.forEach(ring=>{if(ring.length>1){let pts=ring.map(p=>P(p[1],p[0],1.012));let gg=new THREE.BufferGeometry().setFromPoints(pts);borderG.add(new THREE.Line(gg,bm))}})});});tex.needsUpdate=true;drawTerrain(j)}catch(e){}}function drawTerrain(j){let ctx=map.x;ctx.save();for(let i=0;i<150;i++){let lat=-65+Math.random()*130,lon=-175+Math.random()*350;let col=lat>55?'#e9edf0':lat>30?'#8fca55':lat>-35?'#5eab50':'#77b94f';brush(ctx,xy(lon),yy(lat),30+Math.random()*80,12+Math.random()*35,col,12)}for(let i=0;i<80;i++){let lat=-60+Math.random()*120,lon=-170+Math.random()*340;ctx.strokeStyle='#2d7049';ctx.globalAlpha=.3;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xy(lon),yy(lat));ctx.quadraticCurveTo(xy(lon)+25,yy(lat)-25,xy(lon)+50,yy(lat));ctx.stroke()}ctx.restore();tex.needsUpdate=true}borders();function addIllustration(lat,lon,type){let group=new THREE.Group();group.position.copy(P(lat,lon,1.025));let col=type==='mountain'?0x6d8d4c:type==='tree'?0x2c8754:0xd8a34e;let m=new THREE.Mesh(new THREE.ConeGeometry(.025,.07,5),new THREE.MeshBasicMaterial({color:col}));group.add(m);artG.add(group)}for(let i=0;i<80;i++)addIllustration(-55+Math.random()*120,-175+Math.random()*350,Math.random()>.5?'tree':'mountain');const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.2,depthWrite:false});const cloudG=new THREE.Group();earth.add(cloudG);for(let i=0;i<25;i++){let g=new THREE.Group(),lat=-60+Math.random()*120,lon=-180+Math.random()*360;g.position.copy(P(lat,lon,1.018));let m=new THREE.Mesh(new THREE.SphereGeometry(.055+Math.random()*.05,12,8),cloudMat);m.scale.set(1.8,.55,.8);g.add(m);cloudG.add(g)}const hits=[];function mark(lat,lon,col,sz,data){let g=new THREE.Group();g.position.copy(P(lat,lon,1.04));let m=new THREE.Mesh(new THREE.SphereGeometry(sz,10,10),new THREE.MeshBasicMaterial({color:col}));let q=new THREE.Mesh(new THREE.RingGeometry(sz*1.7,sz*2.1,16),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:.7}));q.rotation.x=Math.PI/2;g.add(m,q);g.userData=data;eventG.add(g);hits.push(g)}async function live(){try{let q=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson').then(x=>x.json());eventG.clear();hits.length=0;q.features.forEach(f=>{let[lon,lat,dep]=f.geometry.coordinates,m=f.properties.mag||1;mark(lat,lon,0xff4038,Math.max(.008,Math.min(.022,.005+m*.003)),{kind:'EARTHQUAKE',m,place:f.properties.place,dep})});$('#eq').textContent=q.features.length;let arr=[];for(let lat=-60;lat<=60;lat+=20)for(let lon=-180;lon<180;lon+=30)arr.push([lat,lon]);let u='https://api.open-meteo.com/v1/forecast?latitude='+arr.map(x=>x[0]).join(',')+'&longitude='+arr.map(x=>x[1]).join(',')+'&current=weather_code,temperature_2m,wind_speed_10m&timezone=UTC';let w=await fetch(u).then(x=>x.json()),n=0;(Array.isArray(w)?w:[w]).forEach((x,i)=>{if(x.current?.weather_code>=95){mark(arr[i][0],arr[i][1],0xa84cff,.014,{kind:'STORM',temp:x.current.temperature_2m,wind:x.current.wind_speed_10m});n++}});$('#st').textContent=n}catch(e){}}live();setInterval(live,60000);function rotate(dx,dy){let qx=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-dx*2.8),axis=new THREE.Vector3(1,0,0).applyQuaternion(earth.quaternion),qy=new THREE.Quaternion().setFromAxisAngle(axis,-dy*2.8);earth.quaternion.premultiply(qy.multiply(qx))}c.onpointerdown=e=>{if(e.target.closest?.('.b,.layer'))return;drag={x:e.clientX,y:e.clientY,m:false};c.setPointerCapture?.(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let dx=(e.clientX-drag.x)/innerWidth,dy=(e.clientY-drag.y)/innerHeight;if(Math.hypot(dx,dy)>.001){rotate(dx,dy);vx=dx;vy=dy;drag.x=e.clientX;drag.y=e.clientY;drag.m=true}};c.onpointerup=e=>{if(drag&&!drag.m){let ray=new THREE.Raycaster(),m=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(m,cam);let h=ray.intersectObjects(hits,true)[0];if(h)show(h.object.parent.userData||h.object.userData)}drag=null};c.onwheel=e=>{e.preventDefault();target=THREE.MathUtils.clamp(target*Math.exp(-e.deltaY*.0025),.62,14)};c.ontouchstart=e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)};c.ontouchmove=e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)target=THREE.MathUtils.clamp(target*d/pinch,.62,14);pinch=d}};c.ontouchend=()=>pinch=0;function show(d){let h=d.kind==='EARTHQUAKE'?'<b>ERDBEBEN</b><h2>M '+d.m.toFixed(1)+'</h2>'+d.place+'<br>'+d.dep+' km Tiefe':'<b>UNWETTER</b><h2>STURMZELLE</h2>'+d.temp+' °C · '+d.wind+' km/h';$('#info').innerHTML='<span class="close" onclick="this.parentElement.classList.remove(\'show\')">×</span>'+h;$('#info').classList.add('show')}document.querySelectorAll('.layer').forEach(b=>b.onclick=()=>{b.classList.toggle('on');let x=b.dataset.x;if(x==='b')borderG.visible=b.classList.contains('on');if(x==='g')gridG.visible=b.classList.contains('on');if(x==='e'||x==='w')eventG.visible=document.querySelector('[data-x="e"]').classList.contains('on')||document.querySelector('[data-x="w"]').classList.contains('on')});for(let lat=-60;lat<=60;lat+=30){let a=[];for(let lon=-180;lon<=180;lon+=3)a.push(P(lat,lon,1.01));let gg=new THREE.BufferGeometry().setFromPoints(a);gridG.add(new THREE.Line(gg,gm))}for(let lon=-180;lon<180;lon+=30){let a=[];for(let lat=-88;lat<=88;lat+=3)a.push(P(lat,lon,1.01));let gg=new THREE.BufferGeometry().setFromPoints(a);gridG.add(new THREE.Line(gg,gm))}$('#reset').onclick=()=>{earth.quaternion.identity();target=.72};let ac;$('#sound').onclick=()=>{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=55;g.gain.value=.018;o.connect(g).connect(ac.destination);o.start()}};$('#enter').onclick=()=>{$('#intro').style.opacity=0;setTimeout(()=>$('#intro').remove(),500)};function loop(t){requestAnimationFrame(loop);zoom+=(target-zoom)*.1;earth.scale.setScalar(zoom);if(!drag){earth.rotation.y+=vx*.25;earth.rotation.x+=vy*.08;vx*=.94;vy*=.94}cloudG.rotation.y+=.00025;let mode=zoom<1.1?'PLANET':zoom<2.2?'CONTINENT':zoom<4?'COUNTRY':zoom<8?'REGION':'DETAIL';$('#mode').textContent=mode;$('#z').textContent=zoom.toFixed(1)+'×';r.render(scene,cam)}loop(0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight,false)})</script></body></html>
