<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071412">
<title>YOU ARE BEING TESTED</title>
<style>
:root{--bg:#071412;--ink:#efe6d6;--muted:#9aa69f;--line:#2d403a;--cream:#efe0c5;--gold:#c6a06c;--teal:#3d6962}*{box-sizing:border-box}html,body{margin:0;background:#030908;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}button{font:inherit}.screen{width:100%;max-width:480px;min-height:100dvh;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}.top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:#77857e;text-transform:uppercase}.art{height:36dvh;min-height:230px;max-height:340px;margin:12px -18px 16px;position:relative;overflow:hidden;border-top:1px solid #1c2b27;border-bottom:1px solid #1c2b27}.art svg{width:100%;height:100%;display:block}.fade{animation:in .45s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}h1,h2,.question{font-family:Georgia,serif;font-weight:400}.hero{justify-content:space-between}.hero .art{height:47dvh;max-height:430px;border:0;margin-top:-8px}.kicker{font-size:9px;letter-spacing:3px;color:#b8a98e;text-transform:uppercase}.hero h1{font-size:clamp(45px,13vw,66px);line-height:.9;letter-spacing:-3px;margin:12px 0 16px}.lead,.resultText{font-size:14px;line-height:1.65;color:#aeb9b2}.cta,.option{cursor:pointer;touch-action:manipulation}.cta{width:100%;border:1px solid var(--cream);background:var(--cream);color:#071412;border-radius:999px;padding:15px;margin-top:18px;font-weight:700;letter-spacing:1.3px}.note{font-size:9px;line-height:1.6;color:#68736e;letter-spacing:1px;text-transform:uppercase;margin-top:12px}.counter{font-size:9px;letter-spacing:2px;color:#77857e}.question{font-size:22px;line-height:1.27;margin:2px 0 14px}.options{margin-top:auto}.option{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:#0a1916e8;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 11px;margin:7px 0;min-height:52px;transition:.18s}.option:active{transform:scale(.985);border-color:#9d9b88;background:#11231e}.badge{width:27px;height:27px;min-width:27px;border:1px solid #61716a;border-radius:50%;display:grid;place-items:center;font-size:11px}.optionText{font-size:13.5px;line-height:1.32}.hint{font-size:9px;color:#65726c;letter-spacing:1.4px;text-transform:uppercase;text-align:center;margin-top:8px}.pause,.analysis,.result{justify-content:center}.pause .orb{width:170px;height:170px;border-radius:50%;margin:0 auto 30px;background:radial-gradient(circle at 35% 30%,#efe0c5 0 4%,#c6a06c 5% 14%,#315d57 15% 34%,#0b1917 35% 70%,#071412 71%);box-shadow:0 0 0 1px #58726a,0 0 70px #3d696233;animation:float 4s ease-in-out infinite}.orb:after{content:"";position:absolute;inset:-14px;border:1px solid #c6a06c55;border-radius:50%;animation:spin 12s linear infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes spin{to{transform:rotate(360deg)}}.pause h2{font-size:42px;line-height:.95;margin:0 0 12px}.pause p{font-size:14px;line-height:1.7;color:#9aa69f}.analysisArt{height:240px}.scan{height:1px;background:#20312c;overflow:hidden;margin:20px 0}.scan i{display:block;height:100%;width:30%;background:var(--cream);animation:scan 1.4s ease-in-out infinite alternate}@keyframes scan{to{width:95%}}.scanList{list-style:none;padding:0;margin:0;color:#77837d;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;line-height:2.3}.scanList li{opacity:0;animation:show .3s forwards}.scanList li:nth-child(1){animation-delay:.1s}.scanList li:nth-child(2){animation-delay:.25s}.scanList li:nth-child(3){animation-delay:.4s}.scanList li:nth-child(4){animation-delay:.55s}.scanList li:nth-child(5){animation-delay:.7s}@keyframes show{to{opacity:1}}.result .art{height:31dvh;min-height:210px}.result h2{font-size:38px;line-height:.98;margin:4px 0 12px}.insight{background:#0a1916cc;border:1px solid #2c3d38;border-radius:13px;padding:14px;margin-top:14px}.label{font-size:8px;letter-spacing:2px;color:#849089;text-transform:uppercase;margin-bottom:7px}.insight strong{font:400 19px/1.2 Georgia,serif}.secondary{width:100%;background:transparent;color:#d9d1c2;border:1px solid #50605a;border-radius:999px;padding:13px;margin-top:9px}.small{font-size:9px;color:#68736e;line-height:1.6;margin-top:12px}@media(max-height:700px){.art{height:29dvh;min-height:190px}.question{font-size:20px}.option{padding:10px;min-height:46px}.optionText{font-size:12.5px}.hero .art{height:40dvh}}
</style></head><body><main id="app"></main>
<script>
const S=[
["coffee","Du hast morgen einen wichtigen Termin. Deine normale Strecke ist wegen einer Baustelle deutlich langsamer. Eine alternative Strecke kennst du nicht.",["Ich nehme die bekannte Strecke und plane mehr Zeit ein.","Ich probiere die alternative Strecke.","Ich schaue mir kurz Verkehr und Strecke an.","Ich entscheide morgen spontan."]],
["purchase","Du willst etwas für 120 € kaufen. Drei gute Bewertungen stehen einer ausführlichen negativen Bewertung gegenüber.",["Ich kaufe es trotzdem.","Ich suche gezielt nach weiteren Erfahrungen.","Ich lasse es lieber.","Ich frage jemanden, der das Produkt kennt."]],
["work","Nach einer Stunde merkst du, dass dein Ansatz wahrscheinlich nicht funktioniert. Ein Neustart würde viel Arbeit kosten.",["Ich bleibe erstmal beim bisherigen Ansatz.","Ich stoppe und beginne neu.","Ich prüfe, ob sich der Ansatz noch retten lässt.","Ich hole eine zweite Meinung ein."]],
["queue","Du wartest seit 20 Minuten. Eine zweite Schlange sieht schneller aus, aber du weißt nicht warum.",["Ich bleibe, wo ich bin.","Ich wechsle.","Ich beobachte kurz beide Schlangen.","Ich frage jemanden dort."]],
["meeting","In einer Besprechung klingt ein Vorschlag plausibel, aber dir fehlt eine wichtige Information.",["Ich stimme zu und kläre Details später.","Ich frage direkt nach der Information.","Ich widerspreche erstmal.","Ich beobachte, wie die anderen reagieren."]],
["money","Du bekommst 1.000 € zusätzlich. Du kannst sie sofort ausgeben oder ein Jahr zurücklegen.",["Ich gebe einen Teil sofort aus.","Ich lege das Geld zurück.","Ich teile es auf.","Ich entscheide danach, was gerade wichtig ist."]],
["map","In einer fremden Stadt gibt es einen schnellen unbekannten Weg und einen längeren, den du gut nachvollziehen kannst.",["Ich nehme den schnellen Weg.","Ich nehme den nachvollziehbaren Weg.","Ich prüfe kurz Umgebung und Strecke.","Ich frage jemanden vor Ort."]],
["group","Vier Personen sind sich einig. Du hast noch keine klare Meinung, aber etwas an ihrer Begründung überzeugt dich nicht.",["Ich schließe mich erstmal an.","Ich stelle eine kritische Frage.","Ich entscheide mich bewusst dagegen.","Ich warte auf neue Informationen."]],
["repair","Etwas, das du regelmäßig benutzt, funktioniert plötzlich nicht mehr. Du kannst selbst suchen oder Hilfe holen.",["Ich suche zuerst selbst nach der Ursache.","Ich hole direkt Hilfe.","Ich suche eine Anleitung und gehe Schritt für Schritt vor.","Ich probiere ein paar Dinge aus."]],
["chance","Du bekommst kurzfristig eine interessante Aufgabe. Sie passt nicht perfekt, könnte aber neue Möglichkeiten eröffnen.",["Ich sage zu.","Ich lehne ab, weil sie nicht gut passt.","Ich frage nach den Erwartungen.","Ich frage jemanden, der die Aufgabe kennt."]],
["mistake","Kurz vor dem Abschicken bemerkst du einen möglichen Fehler. Eine gründliche Prüfung kostet Zeit.",["Ich schicke es ab, wenn es wahrscheinlich reicht.","Ich prüfe alles noch einmal.","Ich prüfe gezielt die kritische Stelle.","Ich lasse jemanden kurz drüberschauen."]],
["choice","Du kannst 100 € sicher bekommen oder mit 40 % Wahrscheinlichkeit 300 €. Die Entscheidung muss jetzt fallen.",["100 € sicher.","300 € versuchen.","Ich rechne kurz nach.","Ich nehme die Option, die sich richtig anfühlt."]],
["feedback","Jemand kritisiert ungefragt etwas, das du gemacht hast. Ein Teil klingt berechtigt, ein Teil nicht.",["Ich nehme es erstmal ernst.","Ich verteidige meine Entscheidung.","Ich frage nach einem konkreten Beispiel.","Ich ignoriere es, wenn ich anderer Meinung bin."]],
["change","Eine neue Information macht deinen Plan deutlich schlechter, obwohl du schon viel Zeit investiert hast.",["Ich ziehe den Plan trotzdem durch.","Ich ändere den Plan.","Ich prüfe, wie wichtig die Information wirklich ist.","Ich hole eine zweite Einschätzung."]],
["trust","Eine selbstbewusste Person gibt eine Antwort. Du hältst sie für wahrscheinlich falsch.",["Ich sage direkt, was ich denke.","Ich prüfe erst meine eigene Einschätzung.","Ich lasse mich überzeugen, wenn die Begründung gut ist.","Ich sage erstmal nichts."]],
["time","Du könntest vor einer Entscheidung noch Informationen suchen. Das würde 15 Minuten kosten, wahrscheinlich aber nicht alles klären.",["Ich entscheide jetzt.","Ich suche noch Informationen.","Ich setze mir zwei Minuten für die Prüfung.","Ich frage jemanden, der sich auskennt."]]
];
let i=0,score={risk:0,caution:0,reflect:0,explore:0,social:0,independent:0,plan:0,flex:0},times=[],started=0,audio=null;
function sound(f=440,d=.07){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d+.02)}catch(e){}}
function art(type){let shapes={coffee:`<circle cx="210" cy="150" r="70"/><path d="M120 180 Q210 90 300 180 T470 150"/>`,purchase:`<rect x="150" y="70" width="150" height="180" rx="18"/><circle cx="225" cy="160" r="55"/>`,work:`<path d="M70 220 L160 80 L250 220 L340 80 L430 220"/><circle cx="250" cy="150" r="35"/>`,queue:`<path d="M60 210 C150 40 260 310 430 110"/><circle cx="180" cy="150" r="20"/>`,meeting:`<circle cx="230" cy="145" r="90"/><path d="M80 250 Q230 40 400 250"/>`,money:`<rect x="100" y="90" width="260" height="150" rx="20"/><circle cx="230" cy="165" r="45"/>`,map:`<path d="M80 210 L160 70 L260 210 L350 80 L430 220"/><circle cx="260" cy="130" r="18"/>`,group:`<circle cx="230" cy="150" r="80"/><circle cx="100" cy="210" r="25"/><circle cx="360" cy="210" r="25"/>`,repair:`<circle cx="230" cy="150" r="70"/><path d="M230 80 V220 M160 150 H300"/>`,chance:`<path d="M80 220 Q230 30 420 180"/><circle cx="320" cy="130" r="35"/>`,mistake:`<path d="M80 80 L380 240 M380 80 L80 240"/><circle cx="230" cy="160" r="55"/>`,choice:`<path d="M80 160 H380 M230 60 V260"/><circle cx="230" cy="160" r="70"/>`,feedback:`<circle cx="230" cy="150" r="90"/><path d="M170 130 Q230 190 290 130"/>`,change:`<path d="M80 220 L200 90 L290 180 L420 60"/><circle cx="290" cy="180" r="25"/>`,trust:`<circle cx="230" cy="150" r="90"/><path d="M140 190 Q230 100 320 190"/>`,time:`<circle cx="230" cy="150" r="90"/><path d="M230 150 L230 90 M230 150 L290 180"/>`};return `<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#c6a06c" stroke-width="1.4" opacity=".8">${shapes[type]||shapes.coffee}</g><g fill="none" stroke="#3d6962" stroke-width="1" opacity=".65"><circle cx="230" cy="150" r="115"/><circle cx="230" cy="150" r="145" stroke-dasharray="3 11"><animateTransform attributeName="transform" type="rotate" from="0 230 150" to="360 230 150" dur="18s" repeatCount="indefinite"/></circle></g><circle cx="230" cy="150" r="6" fill="#efe0c5"><animate attributeName="r" values="5;9;5" dur="2.6s" repeatCount="indefinite"/></circle></svg>`}
function base(body){document.getElementById('app').innerHTML=`<section class="screen fade">${body}</section>`}
function start(){sound(360,.1);started=performance.now();showQ()}
function showQ(){let x=S[i];base(`<div class="top"><span>SESSION</span><span class="counter">${String(i+1).padStart(2,'0')} / 16</span></div><div class="art">${art(x[0])}</div><div class="question">${x[1]}</div><div class="options">${x[2].map((t,n)=>`<button class="option" onclick="choose(${n})"><span class="badge">${String.fromCharCode(65+n)}</span><span class="optionText">${t}</span></button>`).join('')}</div><div class="hint">Wähle intuitiv.</div>`);started=performance.now()}
function choose(n){let dt=(performance.now()-started)/1000;times.push(dt);let traits=['risk','caution','reflect','explore','social','independent','plan','flex'];let k=traits[(n*2+i)%traits.length];score[k]+=1+(dt<3?1:0);sound(300+n*100,.08);i++;if(i===8){setTimeout(pause,180)}else if(i<S.length)setTimeout(showQ,180);else setTimeout(analyze,180)}
function pause(){base(`<div class="pause"><div class="orb"></div><div class="kicker">KURZE PAUSE</div><h2>Interessant.</h2><p>Bis hierhin gibt es bereits genug Muster. Der nächste Teil wird nicht leichter.</p><button class="cta" onclick="sound(520,.1);showQ()">WEITER</button></div>`);i=8}
function analyze(){sound(180,.5);base(`<div class="analysis"><div class="art analysisArt">${art('change')}</div><div class="kicker">AUSWERTUNG</div><h2 style="font:400 38px/1 Georgia,serif;margin:10px 0">Wir schauen genauer hin.</h2><div class="scan"><i></i></div><ul class="scanList"><li>Entscheidungsabstände</li><li>Wiederkehrende Muster</li><li>Ambiguität</li><li>Risiko & Kontrolle</li><li>Reaktionsdynamik</li></ul></div>`);setTimeout(result,3000)}
function result(){let vals=Object.entries(score).sort((a,b)=>b[1]-a[1]),top=vals[0][0],map={risk:'Du gehst eher ins Ungewisse, wenn es sich nach einer echten Chance anfühlt.',caution:'Du sicherst Entscheidungen gern ab, bevor du dich festlegst.',reflect:'Du investierst auffällig oft einen Moment mehr, um eine Entscheidung zu prüfen.',explore:'Neues scheint dich eher anzuziehen als abzuschrecken.',social:'Andere Perspektiven spielen bei deinen Entscheidungen eine sichtbare Rolle.',independent:'Du verlässt dich häufig auf deine eigene Einschätzung.',plan:'Du denkst Entscheidungen gern einen Schritt weiter.',flex:'Wenn sich die Lage ändert, kannst du deine Richtung relativ gut anpassen.'},title={risk:'DU GEHST INS RISIKO',caution:'DU SICHERST AB',reflect:'DU DENKST TIEFER',explore:'DU SUCHST DAS NEUE',social:'DU DENKST IN KONTEXT',independent:'DU TRAUST DIR',plan:'DU DENKST VORAUS',flex:'DU KANNST UMSCHALTEN'}[top];base(`<div class="top"><span>SESSION ENDE</span><span>16 / 16</span></div><div class="art">${art(top==='risk'?'choice':top)}</div><div class="kicker">DEIN MUSTER</div><h2>${title}</h2><p class="resultText">${map[top]}</p><div class="insight"><div class="label">Wichtig</div><strong>Das ist kein Persönlichkeitstest. Es beschreibt nur Muster dieser Session.</strong></div><button class="secondary" onclick="location.reload()">NOCH EINMAL</button><div class="small">Experimenteller Verhaltens-Prototyp. Nicht diagnostisch und nicht wissenschaftlich validiert.</div>`)}
base(`<div class="hero screen"><div class="top"><span>EXPERIMENT 01</span><span>PRIVATE SESSION</span></div><div class="art">${art('choice')}</div><div><div class="kicker">DU WIRST GETESTET</div><h1>YOU ARE<br>BEING<br>TESTED</h1><p class="lead">Keine richtigen Antworten. Nur Entscheidungen. Und vielleicht bemerkst du irgendwann, dass nicht nur die Fragen beobachtet werden.</p><button class="cta" onclick="start()">BEGINNEN</button><div class="note">16 Situationen · intuitive Entscheidungen · experimentelle Auswertung</div></div></div>`);
</script></body></html>
