<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EARTH LIVE — Planetary Observatory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010207;color:#eef5ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none;position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;z-index:5}.brand{font-size:12px;font-weight:800;letter-spacing:.32em}.sub{font-size:8px;letter-spacing:.18em;color:#738197;margin-top:6px}.live{display:flex;align-items:center;gap:7px;font-size:8px;letter-spacing:.2em;color:#79e7b5}.live i{width:6px;height:6px;border-radius:50%;background:#79e7b5;box-shadow:0 0 14px #79e7b5;animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}.panel{position:absolute;left:18px;top:92px;width:190px;padding:12px;border:1px solid rgba(160,200,240,.14);background:rgba(3,8,17,.55);backdrop-filter:blur(14px);border-radius:12px;font-size:8px;letter-spacing:.12em;color:#7f90a8;z-index:5}.row{display:flex;justify-content:space-between;margin:6px 0}.row b{color:#dce8f8;font-weight:600}.storm{color:#a9d8ff}.quake{color:#ffb26d}.clock{position:absolute;right:18px;bottom:max(18px,env(safe-area-inset-bottom));text-align:right;font-variant-numeric:tabular-nums;z-index:5}.clock .big{font-size:12px;letter-spacing:.12em}.clock .small{font-size:7px;color:#64738a;letter-spacing:.13em;margin-top:5px}.hint{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:7px;color:#536176;letter-spacing:.18em;white-space:nowrap;z-index:5}.controls{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto;z-index:8}.btn{width:34px;height:34px;border:1px solid rgba(160,200,240,.16);border-radius:50%;background:rgba(4,9,18,.62);color:#d8e7fb;backdrop-filter:blur(12px);font-size:14px}.btn:active{transform:scale(.92)}#loading{position:fixed;inset:0;background:#010207;display:grid;place-items:center;z-index:20;transition:opacity 1s}.load{text-align:center}.load h1{font-size:15px;letter-spacing:.4em;margin:0 0 14px}.load p{font-size:8px;color:#64748b;letter-spacing:.2em}.bar{width:180px;height:1px;background:#1a2433;margin:20px auto;overflow:hidden}.bar i{display:block;width:30%;height:100%;background:#c9dcf6;animation:load 1.3s infinite}@keyframes load{to{transform:translateX(600%)}}#audioHint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border:1px solid rgba(160,200,240,.2);background:rgba(3,8,17,.82);border-radius:12px;color:#bcd0e9;font-size:8px;letter-spacing:.16em;opacity:0;transition:.4s;z-index:15;pointer-events:none;text-align:center}@media(max-width:600px){.panel{top:78px;left:12px;width:165px;font-size:7px}.top{left:12px;right:12px}.brand{font-size:10px}.hint{bottom:max(18px,env(safe-area-inset-bottom))}.controls{top:14px}.btn{width:32px;height:32px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="globe"></canvas>
<div class="ui">
 <div class="top"><div><div class="brand">EARTH LIVE</div><div class="sub">REAL-TIME PLANETARY OBSERVATORY</div></div><div class="live"><i></i>LIVE</div></div>
 <div class="panel"><div class="row"><span>UTC</span><b id="utc">--:--:--</b></div><div class="row"><span>EARTHQUAKES / 24H</span><b class="quake" id="quakes">—</b></div><div class="row"><span>STORM CELLS</span><b class="storm" id="storms">—</b></div><div class="row"><span>DATA</span><b id="age">CONNECTING</b></div></div>
 <div class="controls"><button class="btn" id="audio">♪</button><button class="btn" id="reset">↺</button></div>
 <div class="hint">DRAG TO ROTATE · PINCH / WHEEL TO ZOOM · TAP A SIGNAL</div>
 <div class="clock"><div class="big" id="focus">50.0° N&nbsp;&nbsp;8.0° E</div><div class="small">USGS EARTHQUAKES · OPEN-METEO WEATHER</div></div>
</div>
<div id="audioHint">TAP TO ACTIVATE PLANETARY AMBIENCE</div>
<div id="loading"><div class="load"><h1>EARTH LIVE</h1><div class="bar"><i></i></div><p>CONNECTING TO EARTH DATA</p></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const cvs=document.getElementById('globe');
const renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x010207);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(0,0,3.35);
const controls=new OrbitControls(camera,cvs);controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=.065;controls.rotateSpeed=.45;controls.zoomSpeed=.7;controls.minDistance=1.72;controls.maxDistance=5.8;controls.autoRotate=true;controls.autoRotateSpeed=.12;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;controls.target.set(0,0,0);
const tex=new THREE.TextureLoader();
const EARTH='https://svs.gsfc.nasa.gov/vis/a000000/a002900/a002915/bluemarble-2048.png';
const LIGHTS='https://svs.gsfc.nasa.gov/vis/a030000/a030000/a030003/earth_lights_print.jpg';
const earthMat=new THREE.MeshPhongMaterial({map:tex.load(EARTH),bumpMap:tex.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'),bumpScale:.045,specular:new THREE.Color(0x4d6688),shininess:16});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),earthMat);scene.add(earth);
const nightMat=new THREE.MeshBasicMaterial({map:tex.load(LIGHTS),transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false});
const night=new THREE.Mesh(new THREE.SphereGeometry(1.006,96,96),nightMat);scene.add(night);
const cloudMat=new THREE.MeshPhongMaterial({map:tex.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),transparent:true,opacity:.34,depthWrite:false});
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.014,80,80),cloudMat);scene.add(clouds);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.045,80,80),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,vertexShader:`varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 n;void main(){float a=pow(1.0-max(0.,dot(n,vec3(0.,0.,1.))),2.7);gl_FragColor=vec4(.16,.52,1.,a*.75);}`}));scene.add(atmosphere);
const starGeo=new THREE.BufferGeometry(),sp=[];for(let i=0;i<4500;i++){const r=18,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);sp.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc9dcf5,size:.016,sizeAttenuation:true,transparent:true,opacity:.7})));
const sun=new THREE.DirectionalLight(0xffffff,2.8),ambient=new THREE.AmbientLight(0x536a88,.12);scene.add(sun,ambient);
function sunPosition(){const now=new Date();const jd=now.getTime()/86400000+2440587.5,n=jd-2451545;const L=(280.46+.9856474*n)%360,g=(357.528+.9856003*n)%360,rad=Math.PI/180,lambda=(L+1.915*Math.sin(g*rad)+.02*Math.sin(2*g*rad))*rad,eps=(23.4393-.0000004*n)*rad,dec=Math.asin(Math.sin(eps)*Math.sin(lambda)),ra=Math.atan2(Math.cos(eps)*Math.sin(lambda),Math.cos(lambda));const gst=(280.46061837+360.98564736629*(jd-2451545))%360,lon=(gst-ra/rad)*rad;sun.position.set(Math.cos(dec)*Math.cos(lon)*5,Math.sin(dec)*5,Math.cos(dec)*Math.sin(lon)*5)}
const signalGroup=new THREE.Group();earth.add(signalGroup);
function pos(lat,lon,r=1.035){const a=lat*Math.PI/180,b=lon*Math.PI/180;return new THREE.Vector3(r*Math.cos(a)*Math.sin(b),r*Math.sin(a),r*Math.cos(a)*Math.cos(b))}
const signals=[];
function addSignal(lat,lon,type,size=.025){const mat=new THREE.MeshBasicMaterial({color:type==='quake'?0xff9f5a:0x63c8ff,transparent:true,opacity:.95});const m=new THREE.Mesh(new THREE.SphereGeometry(size,12,12),mat);m.position.copy(pos(lat,lon));signalGroup.add(m);signals.push({m,type,base:size,phase:Math.random()*6});return m}
const cities=[['New York',40.7,-74],["Mexico City",19.4,-99.1],['London',51.5,-.1],['Berlin',52.5,13.4],['Lagos',6.5,3.4],['Cairo',30,31.2],['Johannesburg',-26.2,28],['Dubai',25.2,55.3],['Mumbai',19.1,72.9],['Singapore',1.3,103.8],['Tokyo',35.7,139.7],['Sydney',-33.9,151.2],['Honolulu',21.3,-157.8],['Santiago',-33.4,-70.7]];
const weatherURL='https://api.open-meteo.com/v1/forecast?latitude='+cities.map(c=>c[1]).join(',')+'&longitude='+cities.map(c=>c[2]).join(',')+'&current=temperature_2m,weather_code,wind_speed_10m,precipitation&timezone=UTC';
let stormMarkers=[];
async function loadWeather(){try{const d=await fetch(weatherURL,{cache:'no-store'}).then(r=>r.json());const arr=Array.isArray(d)?d:[d];stormMarkers.forEach(m=>signalGroup.remove(m));stormMarkers=[];let storms=0;arr.forEach((w,i)=>{const code=w.current?.weather_code;if([95,96,99].includes(code)){storms++;stormMarkers.push(addSignal(cities[i][1],cities[i][2],'storm',.018));}});document.getElementById('storms').textContent=storms;document.getElementById('age').textContent='LIVE';}catch(e){document.getElementById('age').textContent='OFFLINE'}}
async function loadQuakes(){try{const d=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',{cache:'no-store'}).then(r=>r.json());document.getElementById('quakes').textContent=d.metadata?.count??d.features.length;signals.filter(s=>s.type==='quake').forEach(s=>signalGroup.remove(s.m));for(const f of d.features.slice(0,90)){const [lon,lat]=f.geometry.coordinates;addSignal(lat,lon,'quake',Math.min(.035,Math.max(.008,(f.properties.mag||1)*.006)));}window.lastData=new Date();}catch(e){document.getElementById('quakes').textContent='—'}}
loadQuakes();loadWeather();setInterval(loadQuakes,60000);setInterval(loadWeather,300000);
let audioCtx,master,started=false;function sound(){if(started){master.gain.setTargetAtTime(master.gain.value>.001?0:.045,audioCtx.currentTime,.12);return}started=true;audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.045;master.connect(audioCtx.destination);const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sine';o.frequency.value=43;g.gain.value=.55;f.type='lowpass';f.frequency.value=220;o.connect(f).connect(g).connect(master);o.start();const l=audioCtx.createOscillator(),lg=audioCtx.createGain();l.frequency.value=.055;lg.gain.value=13;l.connect(lg).connect(o.frequency);l.start();const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.type='triangle';o2.frequency.value=86;g2.gain.value=.025;o2.connect(g2).connect(master);o2.start();}
cvs.addEventListener('pointerdown',()=>{sound();controls.autoRotate=false},{passive:true});document.getElementById('audio').onclick=sound;document.getElementById('reset').onclick=()=>{camera.position.set(0,0,3.35);controls.reset();controls.autoRotate=true};
function clock(){const d=new Date();document.getElementById('utc').textContent=d.toISOString().slice(11,19);document.getElementById('age').textContent=window.lastData?Math.round((Date.now()-window.lastData)/1000)+'s AGO':'CONNECTING';}setInterval(clock,1000);clock();
function focus(){const v=new THREE.Vector3(0,0,1).applyQuaternion(earth.quaternion);const lat=Math.asin(v.y)*180/Math.PI,lon=Math.atan2(v.x,v.z)*180/Math.PI;document.getElementById('focus').textContent=`${Math.abs(lat).toFixed(1)}° ${lat>=0?'N':'S'}   ${Math.abs(lon).toFixed(1)}° ${lon>=0?'E':'W'}`}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
let t=0;function animate(){t+=.01;sunPosition();controls.update();clouds.rotation.y+=.00045;night.rotation.y=earth.rotation.y;atmosphere.rotation.y=earth.rotation.y;signals.forEach(s=>{const pulse=1+Math.sin(t*3+s.phase)*.22;s.m.scale.setScalar(pulse);if(s.type==='quake')s.m.material.opacity=.5+.5*Math.abs(Math.sin(t*2+s.phase));});focus();renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),1000)},1700);setTimeout(()=>{const h=document.getElementById('audioHint');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,3000)},2200);
</script></body></html>
