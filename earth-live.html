<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<title>EARTH LIVE — Planetary Observation</title>
<style>
:root{--cyan:#79d8ff;--green:#67e6a5;--amber:#ffc46b;--line:rgba(160,205,240,.17);--glass:rgba(3,9,17,.62)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#edf5ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}body{position:fixed;inset:0}#app{position:fixed;inset:0;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}.hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between}.brand{font-size:13px;letter-spacing:.32em;font-weight:800}.sub{margin-top:6px;font-size:9px;letter-spacing:.2em;color:#78879c}.live{display:flex;gap:7px;align-items:center;font-size:9px;letter-spacing:.18em;color:var(--green)}.live i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.panel{position:absolute;left:20px;top:94px;width:215px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--glass);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}.row{display:flex;justify-content:space-between;padding:5px 0;font-size:8px;letter-spacing:.09em;color:#7f8ea3}.row b{color:#dce8f7;font-weight:600}.quake{color:var(--amber)!important}.flash{color:#a8e8ff!important}.ok{color:var(--green)!important}.legend{position:absolute;right:20px;top:96px;display:flex;flex-direction:column;gap:7px;font-size:7px;letter-spacing:.1em;color:#7c8ba0}.legend span{display:flex;gap:6px;align-items:center}.dot{width:6px;height:6px;border-radius:50%}.dq{background:var(--amber);box-shadow:0 0 10px var(--amber)}.dl{background:#a8e8ff;box-shadow:0 0 10px #a8e8ff}.bottom{position:absolute;left:20px;right:20px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.hint{font-size:8px;letter-spacing:.13em;color:#6d7c92}.coord{text-align:right}.coord .big{font-size:11px;letter-spacing:.1em}.coord .small{margin-top:5px;font-size:7px;color:#617086;letter-spacing:.12em}.controls{position:absolute;right:20px;bottom:max(64px,calc(env(safe-area-inset-bottom) + 54px));display:flex;gap:7px;pointer-events:auto}.btn{width:39px;height:39px;border:1px solid var(--line);border-radius:50%;background:var(--glass);color:#dceaff;font-size:15px;display:grid;place-items:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.btn:active{transform:scale(.94)}#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#02050b;transition:opacity .8s}.load{text-align:center}.loadtitle{font-size:14px;letter-spacing:.38em}.bar{width:170px;height:1px;background:#1a2737;margin:18px auto;overflow:hidden}.bar i{display:block;width:38%;height:100%;background:#c0d8ef;animation:load 1.1s infinite}@keyframes load{from{transform:translateX(-180px)}to{transform:translateX(180px)}}#audiohint{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:8;padding:9px 13px;border-radius:99px;background:rgba(3,9,17,.78);border:1px solid var(--line);font-size:8px;letter-spacing:.12em;color:#a7bbd2;opacity:0;transition:opacity .35s;white-space:nowrap}@media(max-width:650px){.top{left:15px;right:15px}.brand{font-size:11px}.sub{font-size:7px}.panel{left:14px;top:78px;width:178px;padding:8px 10px}.row{font-size:7px;padding:4px 0}.legend{right:14px;top:80px;font-size:6px}.bottom{left:14px;right:14px}.hint{max-width:150px;line-height:1.5}.coord .big{font-size:9px}.controls{right:14px;bottom:60px}.btn{width:37px;height:37px}}
</style>
</head>
<body>
<div id="app"></div><div class="hud">
<div class="top"><div><div class="brand">EARTH LIVE</div><div class="sub">PLANETARY OBSERVATION SYSTEM</div></div><div class="live"><i></i><span id="liveText">CONNECTING</span></div></div>
<div class="panel"><div class="row"><span>EARTHQUAKES</span><b class="quake" id="quakeCount">—</b></div><div class="row"><span>LIGHTNING</span><b class="flash" id="flashCount">—</b></div><div class="row"><span>ATMOSPHERE</span><b class="ok">LIVE</b></div><div class="row"><span>DATA UPDATE</span><b id="updated">—</b></div></div>
<div class="legend"><span><i class="dot dq"></i>EARTHQUAKE</span><span><i class="dot dl"></i>LIGHTNING</span></div>
<div class="bottom"><div class="hint">DRAG TO ROTATE · PINCH / WHEEL TO ZOOM</div><div class="coord"><div class="big" id="coord">50.0° N&nbsp;&nbsp; 8.0° E</div><div class="small">LIVE PLANETARY DATA</div></div></div>
<div class="controls"><button class="btn" id="sound">♪</button><button class="btn" id="reset">↺</button></div></div>
<div id="audiohint">TOUCH TO ACTIVATE AMBIENT AUDIO</div>
<div id="loading"><div class="load"><div class="loadtitle">EARTH LIVE</div><div class="bar"><i></i></div><div class="sub">CONNECTING TO PLANETARY DATA</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const app=document.getElementById('app'),scene=new THREE.Scene();scene.background=new THREE.Color(0x02050b);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,0,3.15);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;controls.minDistance=1.65;controls.maxDistance=5.8;controls.rotateSpeed=.52;controls.zoomSpeed=.7;controls.autoRotate=true;controls.autoRotateSpeed=.18;controls.screenSpacePanning=false;controls.enableKeys=false;
const stars=new THREE.BufferGeometry(),sv=[];for(let i=0;i<3000;i++){const r=18+Math.random()*25,a=Math.random()*Math.PI*2,z=Math.random()*2-1,s=Math.sqrt(1-z*z);sv.push(r*s*Math.cos(a),r*z,r*s*Math.sin(a))}stars.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xbcd0eb,size:.022,sizeAttenuation:true,transparent:true,opacity:.72})));
const loader=new THREE.TextureLoader(),BASE='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const day=loader.load(BASE+'earth_atmos_2048.jpg');day.colorSpace=THREE.SRGBColorSpace;const normal=loader.load(BASE+'earth_normal_2048.jpg');const spec=loader.load(BASE+'earth_specular_2048.jpg');const night=loader.load(BASE+'earth_lights_2048.png');night.colorSpace=THREE.SRGBColorSpace;const cloudTex=loader.load(BASE+'earth_clouds_1024.png');cloudTex.colorSpace=THREE.SRGBColorSpace;
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),new THREE.MeshPhongMaterial({map:day,normalMap:normal,normalScale:new THREE.Vector2(.42,.42),specularMap:spec,specular:new THREE.Color(0x557799),shininess:17,emissiveMap:night,emissive:new THREE.Color(0x30485f),emissiveIntensity:.55}));scene.add(earth);
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.013,72,72),new THREE.MeshPhongMaterial({map:cloudTex,transparent:true,opacity:.42,depthWrite:false}));scene.add(clouds);
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.04,72,72),new THREE.MeshBasicMaterial({color:0x53b9ff,transparent:true,opacity:.13,side:THREE.BackSide,blending:THREE.AdditiveBlending}));scene.add(atmo);
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-4,2.5,5);scene.add(sun);scene.add(new THREE.AmbientLight(0x5e7695,.16));
const markerGroup=new THREE.Group();scene.add(markerGroup);function pos(lat,lon,r=1.035){const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))}function addMarker(lat,lon,color,size){const m=new THREE.Mesh(new THREE.SphereGeometry(size,10,10),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95}));m.position.copy(pos(lat,lon));markerGroup.add(m)}
let quakeData=[],flashData=[];
async function loadQuakes(){try{const d=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',{cache:'no-store'}).then(r=>r.json());markerGroup.children.filter(x=>x.userData&&x.userData.kind==='q').forEach(x=>markerGroup.remove(x));quakeData=(d.features||[]).filter(f=>f.geometry&&f.properties).slice(0,200);quakeData.forEach(f=>{const [lon,lat]=f.geometry.coordinates;const mag=Math.max(1,Number(f.properties.mag)||1);const m=new THREE.Mesh(new THREE.SphereGeometry(.008+Math.min(mag,7)*.0025,10,10),new THREE.MeshBasicMaterial({color:0xffb45f}));m.position.copy(pos(lat,lon));m.userData.kind='q';markerGroup.add(m)});document.getElementById('quakeCount').textContent=quakeData.length;setLive()}catch(e){document.getElementById('quakeCount').textContent='OFFLINE'}}
async function loadLightning(){try{const d=await fetch('https://volcview.wr.usgs.gov/vv-api/lightningApi/obs',{cache:'no-store'}).then(r=>r.json());const arr=Array.isArray(d)?d:(d.records||d.data||d.lightning||[]);markerGroup.children.filter(x=>x.userData&&x.userData.kind==='l').forEach(x=>markerGroup.remove(x));flashData=arr.filter(x=>x.latitude!=null&&x.longitude!=null).slice(-350);flashData.forEach(f=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.006,8,8),new THREE.MeshBasicMaterial({color:0x9ce7ff}));m.position.copy(pos(Number(f.latitude),Number(f.longitude),1.04));m.userData.kind='l';markerGroup.add(m)});document.getElementById('flashCount').textContent=flashData.length||'0';setLive()}catch(e){document.getElementById('flashCount').textContent='—'}}
function setLive(){document.getElementById('liveText').textContent='LIVE';document.getElementById('updated').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}loadQuakes();loadLightning();setInterval(loadQuakes,60000);setInterval(loadLightning,60000);
let audioCtx=null,master=null;function activateAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.025;master.connect(audioCtx.destination);const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sine';o.frequency.value=48;g.gain.value=.6;f.type='lowpass';f.frequency.value=160;o.connect(f).connect(g).connect(master);o.start();const l=audioCtx.createOscillator(),lg=audioCtx.createGain();l.frequency.value=.07;lg.gain.value=12;l.connect(lg).connect(o.frequency);l.start();document.getElementById('audiohint').style.opacity=0}function toggleSound(){activateAudio();master.gain.setTargetAtTime(master.gain.value>.001?0:.025,audioCtx.currentTime,.08)}renderer.domElement.addEventListener('pointerdown',()=>{activateAudio();controls.autoRotate=false},{passive:true});renderer.domElement.addEventListener('wheel',activateAudio,{passive:true});document.getElementById('sound').onclick=toggleSound;document.getElementById('reset').onclick=()=>{camera.position.set(0,0,3.15);controls.target.set(0,0,0);controls.autoRotate=true};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);function animate(){requestAnimationFrame(animate);controls.update();clouds.rotation.y+=.00014;renderer.render(scene,camera)}animate();setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),800)},1400);setTimeout(()=>{document.getElementById('audiohint').style.opacity=1;setTimeout(()=>document.getElementById('audiohint').style.opacity=0,3500)},1900);
</script></body></html>
