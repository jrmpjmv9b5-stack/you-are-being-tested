<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EARTH LIVE</title>
<style>
:root{--glass:rgba(7,13,24,.62);--line:rgba(170,205,245,.18);--text:#edf5ff;--muted:#8494aa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010308;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}#space{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#071326 0,#020711 38%,#010308 75%)}#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:13px;letter-spacing:.28em;font-weight:800;text-shadow:0 2px 18px #000}.sub{font-size:9px;letter-spacing:.18em;color:var(--muted);margin-top:6px}.status{font-size:9px;letter-spacing:.16em;color:#7ee8ba;display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#7ee8ba;box-shadow:0 0 14px #7ee8ba}
.bottom{position:absolute;left:20px;right:20px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.hint{font-size:9px;letter-spacing:.13em;color:#718097}.coords{text-align:right;font-variant-numeric:tabular-nums}.coords .big{font-size:12px;letter-spacing:.1em}.coords .small{font-size:8px;color:#65748b;margin-top:5px;letter-spacing:.11em}
.controls{position:absolute;left:50%;bottom:max(64px,calc(env(safe-area-inset-bottom) + 54px));transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#dceaff;display:grid;place-items:center;font-size:15px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.25)}.btn:active{transform:scale(.94)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#010308;z-index:5;transition:opacity .8s}.loadbox{text-align:center}.loadtitle{font-size:14px;letter-spacing:.35em}.loadbar{width:160px;height:1px;background:#202938;margin:18px auto;overflow:hidden}.loadbar i{display:block;width:35%;height:100%;background:#b8c9e8;animation:load 1.2s infinite}@keyframes load{0%{transform:translateX(-160px)}100%{transform:translateX(460px)}}
#soundHint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(4,9,18,.78);backdrop-filter:blur(14px);font-size:10px;letter-spacing:.13em;color:#b8c9e8;pointer-events:none;opacity:0;transition:opacity .4s;text-align:center;z-index:4}
@media(max-width:600px){.top{left:16px;right:16px}.bottom{left:16px;right:16px}.brand{font-size:11px}.sub,.hint{font-size:8px}.coords .big{font-size:10px}.controls{bottom:max(58px,calc(env(safe-area-inset-bottom) + 48px))}}
</style>
</head>
<body>
<div id="space"></div><canvas id="globe"></canvas>
<div class="ui"><div class="top"><div><div class="brand">EARTH LIVE</div><div class="sub">PLANETARY OBSERVATION</div></div><div class="status"><span class="dot"></span>LIVE</div></div>
<div class="bottom"><div class="hint">DRAG • PINCH • SCROLL</div><div class="coords"><div class="big" id="coord">50.0° N&nbsp;&nbsp; 8.0° E</div><div class="small">EARTH TEXTURE • REALISTIC GLOBE</div></div></div>
<div class="controls"><button class="btn" id="sound" aria-label="Sound">♪</button><button class="btn" id="reset" aria-label="Reset">↺</button></div></div>
<div id="soundHint">TOUCH TO ACTIVATE AMBIENT SOUND</div>
<div id="loading"><div class="loadbox"><div class="loadtitle">EARTH LIVE</div><div class="loadbar"><i></i></div><div class="sub">LOADING PLANET</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('globe');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,0,3.15);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;controls.minDistance=1.72;controls.maxDistance=5.2;controls.rotateSpeed=.42;controls.zoomSpeed=.65;controls.enableZoom=true;controls.autoRotate=true;controls.autoRotateSpeed=.22;controls.target.set(0,0,0);controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;
const loader=new THREE.TextureLoader();
const earthURL='https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
const bumpURL='https://threejs.org/examples/textures/planets/earth_normal_2048.jpg';
const specURL='https://threejs.org/examples/textures/planets/earth_specular_2048.jpg';
const cloudURL='https://threejs.org/examples/textures/planets/earth_clouds_1024.png';
const earthGeo=new THREE.SphereGeometry(1,96,96);
const earthMat=new THREE.MeshPhongMaterial({map:loader.load(earthURL,t=>t.colorSpace=THREE.SRGBColorSpace),bumpMap:loader.load(bumpURL),bumpScale:.055,specularMap:loader.load(specURL),specular:new THREE.Color(0x557799),shininess:18});
const earth=new THREE.Mesh(earthGeo,earthMat);scene.add(earth);
const cloudMat=new THREE.MeshPhongMaterial({map:loader.load(cloudURL,t=>{t.colorSpace=THREE.SRGBColorSpace}),transparent:true,opacity:.48,depthWrite:false});
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.012,72,72),cloudMat);scene.add(clouds);
const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.035,72,72),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vN;void main(){float i=pow(.72-dot(vN,vec3(0.,0.,1.)),2.6);gl_FragColor=vec4(.12,.43,1.,i*.52);}`}));scene.add(atmo);
const starsGeo=new THREE.BufferGeometry();const pts=[];for(let i=0;i<3500;i++){const r=16,theta=Math.random()*Math.PI*2,phi=Math.acos(2*Math.random()-1);pts.push(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta))}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xbfd3ef,size:.018,sizeAttenuation:true,transparent:true,opacity:.72})));
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-4,2.5,4);scene.add(sun);scene.add(new THREE.AmbientLight(0x6e86a5,.13));
const halo=new THREE.Mesh(new THREE.SphereGeometry(1.09,64,64),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,vertexShader:`varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vN;void main(){float a=pow(max(0.,.75-dot(vN,vec3(0.,0.,1.))),3.);gl_FragColor=vec4(.12,.35,.95,a*.2);}`}));scene.add(halo);

let audioCtx=null,master=null,started=false;
function startSound(){if(started)return;started=true;audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.035;master.connect(audioCtx.destination);const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.value=48;gain.gain.value=.5;filter.type='lowpass';filter.frequency.value=180;osc.connect(filter).connect(gain).connect(master);osc.start();const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();lfo.frequency.value=.07;lg.gain.value=16;lfo.connect(lg).connect(osc.frequency);lfo.start();}
function toggleSound(){if(!started){startSound();return}master.gain.value=master.gain.value>.001?0:.035}
['pointerdown','wheel'].forEach(e=>canvas.addEventListener(e,()=>startSound(),{once:true,passive:true}));document.getElementById('sound').onclick=toggleSound;
document.getElementById('reset').onclick=()=>{controls.reset();camera.position.set(0,0,3.15);controls.autoRotate=true};
canvas.addEventListener('pointerdown',()=>controls.autoRotate=false,{passive:true});
function updateCoord(){const v=new THREE.Vector3(0,0,1).applyQuaternion(earth.quaternion);const lat=Math.asin(v.y)*180/Math.PI;const lon=Math.atan2(v.x,v.z)*180/Math.PI;document.getElementById('coord').textContent=`${Math.abs(lat).toFixed(1)}° ${lat>=0?'N':'S'}   ${Math.abs(lon).toFixed(1)}° ${lon>=0?'E':'W'}`}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
let last=performance.now();function animate(now){const dt=(now-last)/1000;last=now;controls.update();clouds.rotation.y+=dt*.012;earth.rotation.y+=dt*.0015;halo.rotation.y=earth.rotation.y;updateCoord();renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),800)},1200);
setTimeout(()=>{const h=document.getElementById('soundHint');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,3000)},1800);
</script></body></html>
