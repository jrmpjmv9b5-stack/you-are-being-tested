<!DOCTYPE html>
<html lang="de">
<head>

<title>EARTH LIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#eef4ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;align-items:center;justify-content:center}#space{position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,rgba(31,75,135,.16),transparent 28%),radial-gradient(circle at 15% 20%,rgba(55,110,190,.08),transparent 20%),#02040a}canvas{position:absolute;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:13px;letter-spacing:.28em;font-weight:700}.sub{font-size:10px;letter-spacing:.18em;color:#75829a;margin-top:6px}.status{font-size:10px;letter-spacing:.16em;color:#79e0b2;display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#79e0b2;box-shadow:0 0 12px #79e0b2}.bottom{position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;align-items:end}.hint{font-size:10px;letter-spacing:.12em;color:#69758b}.coords{text-align:right;font-variant-numeric:tabular-nums}.coords .big{font-size:13px;letter-spacing:.12em}.coords .small{font-size:9px;color:#68758b;margin-top:5px;letter-spacing:.12em}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02040a;z-index:5;transition:opacity .8s}.loadbox{text-align:center}.loadtitle{font-size:14px;letter-spacing:.35em}.loadbar{width:150px;height:1px;background:#202938;margin:18px auto;overflow:hidden}.loadbar i{display:block;width:35%;height:100%;background:#b8c9e8;animation:load 1.2s infinite}@keyframes load{0%{transform:translateX(-150px)}100%{transform:translateX(430px)}}@media(max-width:600px){.top{top:18px;left:18px;right:18px}.bottom{left:18px;right:18px;bottom:18px}.brand{font-size:11px}.sub{font-size:8px}.hint{font-size:8px}.coords .big{font-size:11px}}
</style></head><body><div id="space"></div><canvas id="earth"></canvas><div class="ui"><div class="top"><div><div class="brand">EARTH LIVE</div><div class="sub">PLANETARY OBSERVATION</div></div><div class="status"><span class="dot"></span>LIVE</div></div><div class="bottom"><div class="hint">MOVE • DRAG • EXPLORE</div><div class="coords"><div class="big" id="coord">50.0° N&nbsp;&nbsp; 8.0° E</div><div class="small">LOCAL WEATHER LAYER • DEMO DATA</div></div></div></div><div id="loading"><div class="loadbox"><div class="loadtitle">EARTH LIVE</div><div class="loadbar"><i></i></div><div class="sub">INITIALIZING PLANET</div></div></div><script>
const canvas=document.getElementById('earth'),ctx=canvas.getContext('2d');let W,H,dpr,rx=.35,ry=-.12,drag=false,lastX=0,lastY=0,t=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const stars=Array.from({length:260},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.15,a:Math.random()*.7+.15})),clouds=Array.from({length:34},()=>({a:Math.random()*Math.PI*2,b:(Math.random()-.5)*1.2,s:.025+Math.random()*.045,z:.3+Math.random()*.7,q:Math.random()*2})),quakes=[{lat:38.2,lon:142.1},{lat:-6.2,lon:147.4},{lat:36.1,lon:36},{lat:-33.4,lon:-71.7}];function project(lat,lon,R,cx,cy){let p=lon*Math.PI/180+ry,q=lat*Math.PI/180+rx,x=Math.cos(q)*Math.sin(p),y=Math.sin(q),z=Math.cos(q)*Math.cos(p);if(z<=0)return null;return{x:cx+x*R,y:cy-y*R,z}}function draw(){t+=.004;ctx.clearRect(0,0,W,H);for(const s of stars){const tw=.55+.45*Math.sin(t*3+s.x*20);ctx.fillStyle=`rgba(185,205,235,${s.a*tw})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill()}const R=Math.min(W,H)*.34,cx=W/2,cy=H/2,g=ctx.createRadialGradient(cx,cy,R*.72,cx,cy,R*1.15);g.addColorStop(0,'rgba(55,125,255,.14)');g.addColorStop(.7,'rgba(40,110,230,.08)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.25,0,Math.PI*2);ctx.fill();const eg=ctx.createRadialGradient(cx-R*.35,cy-R*.35,R*.05,cx,cy,R);eg.addColorStop(0,'#2d6294');eg.addColorStop(.45,'#0e355a');eg.addColorStop(.82,'#071a31');eg.addColorStop(1,'#020914');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();ctx.lineWidth=.45;ctx.strokeStyle='rgba(110,160,205,.13)';for(let lat=-60;lat<=60;lat+=20){ctx.beginPath();for(let lo=-180;lo<=180;lo+=4){let p=project(lat,lo,R,cx,cy);if(p)ctx.lineTo(p.x,p.y)}ctx.stroke()}for(let lo=-180;lo<180;lo+=20){ctx.beginPath();for(let lat=-90;lat<=90;lat+=3){let p=project(lat,lo,R,cx,cy);if(p)ctx.lineTo(p.x,p.y)}ctx.stroke()}const land=[[[70,-140],[55,-125],[45,-115],[25,-105],[15,-90],[30,-80],[45,-75],[60,-80],[70,-95]],[[15,-80],[5,-75],[-10,-75],[-25,-65],[-40,-70],[-55,-65],[-50,-45],[-20,-55],[0,-50],[10,-60]],[[72,-10],[60,10],[55,35],[45,45],[35,30],[25,35],[10,20],[0,30],[-20,15],[-35,25],[-35,0],[-10,-10],[10,-5],[30,-10],[45,-5]],[[60,70],[55,100],[45,125],[30,135],[10,120],[0,100],[20,80],[35,70]],[[-15,110],[-25,120],[-35,150],[-20,155],[-10,135]]];for(const poly of land){ctx.beginPath();let first=true;for(const [lat,lon] of poly){let p=project(lat,lon,R,cx,cy);if(p){if(first){ctx.moveTo(p.x,p.y);first=false}else ctx.lineTo(p.x,p.y)}}ctx.closePath();ctx.fillStyle='rgba(61,111,92,.72)';ctx.fill();ctx.strokeStyle='rgba(130,190,145,.22)';ctx.stroke()}for(const c of clouds){c.a+=c.s*.015;const lat=c.b*50,lon=(c.a*180/Math.PI)%360-180,p=project(lat,lon,R*1.015,cx,cy);if(!p)continue;ctx.globalAlpha=.08+.08*c.z;ctx.fillStyle='#dbe9f7';ctx.beginPath();ctx.ellipse(p.x,p.y,18+18*c.z,5+5*c.z,c.q,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const sunX=Math.cos(t*.08)*R*.95,sunY=-Math.sin(t*.08)*R*.35,sh=ctx.createRadialGradient(cx+sunX*.55,cy+sunY*.55,R*.1,cx+sunX*.55,cy+sunY*.55,R*1.1);sh.addColorStop(.45,'rgba(255,235,170,0)');sh.addColorStop(1,'rgba(0,0,0,.52)');ctx.fillStyle=sh;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='rgba(100,170,255,.38)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();for(const q of quakes){const p=project(q.lat,q.lon,R*1.01,cx,cy);if(!p)continue;const pulse=3+Math.sin(t*4+q.lat)*2;ctx.strokeStyle=`rgba(255,179,107,${.25+.2*Math.sin(t*4)})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,7+pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffb36b';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}draw();canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag){rx+=(e.clientY-lastY)*.004;ry-=(e.clientX-lastX)*.004;lastX=e.clientX;lastY=e.clientY}const x=(e.clientX-W/2)/(Math.min(W,H)*.34),y=(e.clientY-H/2)/(Math.min(W,H)*.34),lat=Math.max(-90,Math.min(90,-y*55)),lon=((x*85-ry*180/Math.PI+540)%360)-180;document.getElementById('coord').textContent=`${Math.abs(lat).toFixed(1)}° ${lat>=0?'N':'S'}   ${Math.abs(lon).toFixed(1)}° ${lon>=0?'E':'W'}`});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);setTimeout(()=>{document.getElementById('loading').style.opacity=0;setTimeout(()=>document.getElementById('loading').remove(),800)},1100);
</script></body></html>
