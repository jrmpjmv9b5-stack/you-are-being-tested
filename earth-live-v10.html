<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>EARTH LIVE — Illustrated</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a35;color:#fff;font-family:system-ui,-apple-system,sans-serif;user-select:none}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;font-weight:1000;font-size:18px;letter-spacing:.12em;text-shadow:3px 3px #123}.brand em{font-style:normal;color:#52c9ff}.tag{font-size:9px;letter-spacing:.2em;color:#77b5df;margin-top:3px}.live{position:absolute;right:18px;top:max(18px,env(safe-area-inset-top));padding:10px 13px;border:2px solid #fff;border-radius:14px;background:#07182ee8;font-weight:900}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff493d;margin-right:7px;box-shadow:0 0 10px #ff493d}.panel{position:absolute;left:16px;top:86px;width:150px;padding:12px;border:2px solid #6ca9d9;border-radius:15px;background:#06172be8;box-shadow:5px 6px 0 #020b18;font-size:9px;line-height:1.65}.panel b{font-size:13px}.legend{margin-top:7px;color:#cfe9ff}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.layers{position:absolute;right:15px;top:84px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.layer{width:48px;height:38px;border:2px solid #5784aa;border-radius:12px;background:#07182ee8;color:#dff3ff;font-weight:900;font-size:9px;box-shadow:3px 3px 0 #020b18}.layer.on{background:#123b5c;border-color:#8ed8ff}.bottom{position:absolute;left:15px;right:15px;bottom:max(15px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.nav{display:flex;gap:7px;pointer-events:auto}.b{border:2px solid #6aa7d5;border-radius:14px;background:#07182eee;color:#fff;font-weight:900;padding:10px 13px}.scale{text-align:right;font-weight:900}.scale small{display:block;color:#86b4d3;margin-top:3px}.info{position:absolute;left:50%;bottom:120px;transform:translate(-50%,15px);width:min(88vw,340px);padding:15px;border:2px solid #75b6e7;border-radius:17px;background:#06172bf5;opacity:0;transition:.2s;pointer-events:none;box-shadow:5px 6px 0 #020b18}.info.show{opacity:1;transform:translate(-50%,0)}.close{float:right;font-size:20px}.hint{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);font-size:9px;color:#83b4d5;letter-spacing:.15em;white-space:nowrap}#intro{position:fixed;inset:0;z-index:9;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#0e3d63,#06172b 58%,#030a14);transition:.45s}.it{font-size:38px;font-weight:1000;letter-spacing:.08em;text-shadow:5px 5px #123}.it span{color:#50caff}.is{margin-top:10px;color:#9bd4f4;letter-spacing:.18em;font-size:10px}.enter{margin-top:28px;border:3px solid #fff;border-radius:18px;padding:14px 22px;background:#1a5b83;color:#fff;font-weight:1000;letter-spacing:.12em;box-shadow:5px 5px 0 #020b18}@media(max-width:520px){.brand{font-size:16px}.panel{width:145px}.legend{display:none}.hint{font-size:8px}.it{font-size:29px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><canvas id="c"></canvas><div id="intro"><div><div class="it">EARTH <span>LIVE</span></div><div class="is">OUR PLANET · DRAWN IN REAL TIME</div><button class="enter" id="enter">START EXPLORING</button></div></div><div class="ui"><div class="brand">EARTH <em>LIVE</em><div class="tag">OUR PLANET · LIVE</div></div><div class="live"><i></i>LIVE</div><div class="panel"><div>LIVE EVENTS</div><div>EARTHQUAKES <b id="eq">—</b></div><div>STORMS <b id="st">—</b></div><div class="legend"><span class="dot" style="background:#ff4038"></span>Earthquake<br><span class="dot" style="background:#b84cff"></span>Storm<br><span class="dot" style="background:#ffd33d"></span>Flight<br><span class="dot" style="background:#9feaff"></span>Satellite</div></div><div class="layers"><button class="layer on" data-x="b">BORDERS</button><button class="layer on" data-x="w">WEATHER</button><button class="layer on" data-x="e">QUAKES</button><button class="layer on" data-x="g">GRID</button></div><div class="bottom"><div class="nav"><button class="b" id="reset">↻</button><button class="b" id="sound">♪</button></div><div class="scale"><span id="mode">PLANET</span><br><small id="z">0.8×</small></div></div><div class="hint">DRAG · DREHEN &nbsp; PINCH · ZOOM &nbsp; TAP · ENTDECKEN</div><div id="info" class="info"></div></div><script type="module">import*as THREE from'three';const $=s=>document.querySelector(s),c=$('#c'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight,false);const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);cam.position.z=3.2;const earth=new THREE.Group();s.add(earth);let zoom=.78,target=.78,drag=null,vx=0,vy=0,pinch=0;function P(lat,lon,rad=1){let a=lat*Math.PI/180,b=lon*Math.PI/180;return new THREE.Vector3(Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)).multiplyScalar(rad)}function line(a,m,g){g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(a),m))}function starfield(){let a=[];for(let i=0;i<1800;i++){let t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);a.push(18*Math.sin(p)*Math.cos(t),18*Math.cos(p),18*Math.sin(p)*Math.sin(t))}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));s.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xd8efff,size:.018,transparent:true,opacity:.8})))}starfield();const tex=new THREE.TextureLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');const geo=new THREE.SphereGeometry(1,128,128);const mat=new THREE.ShaderMaterial({uniforms:{t:{value:tex},time:{value:0}},vertexShader:'varying vec2 u;varying vec3 n;void main(){u=uv;n=normalize((modelMatrix*vec4(normal,0.)).xyz);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform sampler2D t;uniform float time;varying vec2 u;varying vec3 n;void main(){vec3 q=texture2D(t,u).rgb;float land=clamp(smoothstep(.02,.17,q.r-q.b*.65)+smoothstep(.08,.25,q.g-q.b*.72),0.,1.);float l=dot(q,vec3(.299,.587,.114));vec3 ocean=vec3(.015,.34,.58),grass=vec3(.23,.66,.38),field=vec3(.63,.78,.31),desert=vec3(.96,.66,.28),ice=vec3(.93,.91,.80);vec3 lc=l<.32?grass:l<.53?field:desert;lc=mix(lc,ice,smoothstep(.72,.95,l));float bands=floor((l+.08*sin(u.y*30.))*4.)/4.;lc=mix(lc,vec3(.16,.48,.30),.18*bands);vec3 col=mix(ocean,lc,land);col=floor(col*7.)/7.;float edge=pow(1.-max(0.,dot(n,normalize(cameraPosition))),2.5);col+=vec3(.04,.22,.45)*edge;gl_FragColor=vec4(col,1.);}' });earth.add(new THREE.Mesh(geo,mat));const cloud=new THREE.Mesh(new THREE.SphereGeometry(1.018,96,96),new THREE.MeshBasicMaterial({color:0xf4fbff,transparent:true,opacity:.18,wireframe:false,depthWrite:false}));earth.add(cloud);const borderG=new THREE.Group(),gridG=new THREE.Group(),eventG=new THREE.Group();earth.add(borderG,gridG,eventG);const bm=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.9}),gm=new THREE.LineBasicMaterial({color:0x8bd9ff,transparent:true,opacity:.10});async function borders(){try{let j=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/main/data/countries.geojson').then(x=>x.json());j.features.forEach(f=>{let a=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;a.forEach(p=>p.forEach(q=>{if(q.length>1)line(q.map(x=>P(x[1],x[0],1.014)),bm,borderG)}))})}catch(e){}}borders();for(let lat=-60;lat<=60;lat+=30){let a=[];for(let lon=-180;lon<=180;lon+=3)a.push(P(lat,lon,1.01));line(a,gm,gridG)}for(let lon=-180;lon<180;lon+=30){let a=[];for(let lat=-88;lat<=88;lat+=3)a.push(P(lat,lon,1.01));line(a,gm,gridG)}const hits=[];function mark(lat,lon,col,sz,data){let g=new THREE.Group();g.position.copy(P(lat,lon,1.035));let m=new THREE.Mesh(new THREE.SphereGeometry(sz,12,12),new THREE.MeshBasicMaterial({color:col}));let q=new THREE.Mesh(new THREE.RingGeometry(sz*1.7,sz*2.1,16),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:.65}));g.add(m,q);g.userData=data;eventG.add(g);hits.push(g)}async function live(){try{let q=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson').then(x=>x.json());eventG.clear();hits.length=0;q.features.forEach(f=>{let[lon,lat,dep]=f.geometry.coordinates,m=f.properties.mag||1;mark(lat,lon,0xff4038,Math.max(.008,Math.min(.024,.006+m*.003)),{kind:'EARTHQUAKE',m,place:f.properties.place,dep})});$('#eq').textContent=q.features.length;let arr=[];for(let lat=-60;lat<=60;lat+=20)for(let lon=-180;lon<180;lon+=30)arr.push([lat,lon]);let u='https://api.open-meteo.com/v1/forecast?latitude='+arr.map(x=>x[0]).join(',')+'&longitude='+arr.map(x=>x[1]).join(',')+'&current=weather_code,temperature_2m,wind_speed_10m&timezone=UTC';let w=await fetch(u).then(x=>x.json()),n=0;(Array.isArray(w)?w:[w]).forEach((x,i)=>{if(x.current?.weather_code>=95){mark(arr[i][0],arr[i][1],0xb84cff,.014,{kind:'STORM',temp:x.current.temperature_2m,wind:x.current.wind_speed_10m});n++}});$('#st').textContent=n}catch(e){}}live();setInterval(live,60000);function rotate(dx,dy){let qx=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-dx*2.8),axis=new THREE.Vector3(1,0,0).applyQuaternion(earth.quaternion),qy=new THREE.Quaternion().setFromAxisAngle(axis,-dy*2.8);earth.quaternion.premultiply(qy.multiply(qx))}c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:false};c.setPointerCapture?.(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let dx=(e.clientX-drag.x)/innerWidth,dy=(e.clientY-drag.y)/innerHeight;if(Math.hypot(dx,dy)>.001){rotate(dx,dy);vx=dx;vy=dy;drag.x=e.clientX;drag.y=e.clientY;drag.m=true}};c.onpointerup=e=>{if(drag&&!drag.m){let ray=new THREE.Raycaster(),m=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(m,cam);let h=ray.intersectObjects(hits,true)[0];if(h)show(h.object.parent.userData||h.object.userData)}drag=null};c.onwheel=e=>{e.preventDefault();target=THREE.MathUtils.clamp(target*Math.exp(-e.deltaY*.0025),.65,18)};c.ontouchstart=e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)};c.ontouchmove=e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)target=THREE.MathUtils.clamp(target*d/pinch,.65,18);pinch=d}};c.ontouchend=()=>pinch=0;function show(d){let h=d.kind==='EARTHQUAKE'?'<b>ERDBEBEN</b><h2>M '+d.m.toFixed(1)+'</h2>'+d.place+'<br>'+d.dep+' km Tiefe':'<b>UNWETTER</b><h2>STURMZELLE</h2>'+d.temp+' °C · '+d.wind+' km/h';$('#info').innerHTML='<span class="close" onclick="this.parentElement.classList.remove(\'show\')">×</span>'+h;$('#info').classList.add('show')}document.querySelectorAll('.layer').forEach(b=>b.onclick=()=>{b.classList.toggle('on');let x=b.dataset.x;if(x==='b')borderG.visible=b.classList.contains('on');if(x==='g')gridG.visible=b.classList.contains('on');if(x==='e'||x==='w')eventG.visible=document.querySelector('[data-x="e"]').classList.contains('on')||document.querySelector('[data-x="w"]').classList.contains('on')});$('#reset').onclick=()=>{earth.quaternion.identity();target=.78};let ac;$('#sound').onclick=()=>{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=55;g.gain.value=.02;o.connect(g).connect(ac.destination);o.start()}};$('#enter').onclick=()=>{$('#intro').style.opacity=0;setTimeout(()=>$('#intro').remove(),500)};function loop(t){requestAnimationFrame(loop);zoom+=(target-zoom)*.1;earth.scale.setScalar(zoom);if(!drag){earth.rotation.y+=vx*.25;earth.rotation.x+=vy*.08;vx*=.94;vy*=.94}cloud.rotation.y+=.00035;mat.uniforms.time.value=t/1000;let mode=zoom<1.2?'PLANET':zoom<2.5?'CONTINENT':zoom<5?'COUNTRY':zoom<10?'REGION':'DETAIL';$('#mode').textContent=mode;$('#z').textContent=zoom.toFixed(1)+'×';r.render(s,cam)}loop(0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight,false)})</script></body></html>
