<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeitreise-Einkaufswagen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#20231f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#173b2a;color:white;padding:22px max(18px,calc((100% - 1180px)/2))}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#c9d9cf}
.wrap{max-width:1180px;margin:auto;padding:20px 16px 50px}.controls{display:grid;grid-template-columns:1.4fr .7fr .7fr;gap:10px;margin-bottom:18px}
input,select,button{font:inherit}input,select{width:100%;padding:13px 14px;border:1px solid #ccd1cc;border-radius:10px;background:white}
.layout{display:grid;grid-template-columns:1fr 390px;gap:18px}.panel{background:white;border:1px solid #dddeda;border-radius:14px;padding:16px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.cat{border:1px solid #ccd1cc;background:white;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer}.cat.active{background:#173b2a;color:white;border-color:#173b2a}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid #e0e2de;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:10px}.product h3{font-size:15px;margin:0 0 4px}.muted{color:#70766f;font-size:12px}.add{border:0;background:#173b2a;color:white;border-radius:9px;padding:8px 12px;cursor:pointer;align-self:center}
.cart{position:sticky;top:12px}.cart h2{margin-top:0}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eceeea}.qty{display:flex;align-items:center;gap:5px}.qty button{width:30px;height:30px;border:1px solid #ccd1cc;background:white;border-radius:7px}.price{text-align:right}.summary{margin-top:14px}.sumline{display:flex;justify-content:space-between;margin:8px 0}.big{font-size:27px;font-weight:700}.delta{background:#f0f4ef;border-radius:10px;padding:12px;margin-top:12px}.source{font-size:10px;color:#7b817a;margin-top:12px;line-height:1.4}.empty{padding:28px;text-align:center;color:#7a8079}
@media(max-width:850px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}
</style>
</head>
<body>
<header><div><h1>🛒 Zeitreise-Einkaufswagen</h1><p>Was kostete derselbe Einkauf damals – und was kostet er heute?</p></div></header>
<main class="wrap">
<section class="controls">
<input id="search" placeholder="Produkt suchen, z. B. Milch, Butter, Nutella …">
<select id="year"></select>
<select id="store"><option>Alle Händler</option><option>REWE</option><option>EDEKA</option><option>Aldi</option><option>Lidl</option><option>Kaufland</option><option>Penny</option><option>Netto</option></select>
</section>
<div class="layout">
<section class="panel"><div class="categories" id="cats"></div><div class="products" id="products"></div></section>
<aside class="panel cart"><h2>Dein Warenkorb</h2><div id="cart"></div></aside>
</div>
</main>
<script>
const products=[
{id:1,name:"JA! H-Milch",brand:"REWE",size:"1 l",cat:"Milch & Kühlung",prices:{2008:0.55,2010:0.59,2013:0.69,2015:0.69,2020:0.79,2023:0.99,2026:1.19}},
{id:2,name:"Kerrygold Butter",brand:"Kerrygold",size:"250 g",cat:"Milch & Kühlung",prices:{2008:1.19,2010:1.29,2013:1.59,2015:1.69,2020:1.89,2023:2.49,2026:3.29}},
{id:3,name:"Eier",brand:"Freiland",size:"10 Stück",cat:"Milch & Kühlung",prices:{2008:1.29,2010:1.39,2013:1.49,2015:1.59,2020:1.69,2023:2.49,2026:2.79}},
{id:4,name:"Weizenmehl",brand:"ja!",size:"1 kg",cat:"Grundnahrung",prices:{2008:0.39,2010:0.45,2013:0.49,2015:0.49,2020:0.49,2023:0.79,2026:0.89}},
{id:5,name:"Spaghetti",brand:"Barilla",size:"500 g",cat:"Grundnahrung",prices:{2008:0.99,2010:1.09,2013:1.19,2015:1.29,2020:1.39,2023:1.79,2026:1.99}},
{id:6,name:"Nutella",brand:"Ferrero",size:"450 g",cat:"Süßes",prices:{2008:1.99,2010:2.19,2013:2.49,2015:2.59,2020:2.99,2023:3.99,2026:4.49}},
{id:7,name:"Toastbrot",brand:"Golden Toast",size:"500 g",cat:"Brot",prices:{2008:0.99,2010:1.09,2013:1.19,2015:1.29,2020:1.49,2023:1.79,2026:1.99}},
{id:8,name:"Rinderhackfleisch",brand:"Frisch",size:"500 g",cat:"Fleisch",prices:{2008:2.99,2010:3.29,2013:3.49,2015:3.99,2020:4.49,2023:5.49,2026:6.49}},
{id:9,name:"Bananen",brand:"Lose",size:"1 kg",cat:"Obst & Gemüse",prices:{2008:1.19,2010:1.19,2013:1.29,2015:1.29,2020:1.39,2023:1.69,2026:1.79}},
{id:10,name:"Kaffee",brand:"Jacobs Krönung",size:"500 g",cat:"Getränke",prices:{2008:4.49,2010:4.99,2013:5.49,2015:5.79,2020:6.49,2023:7.49,2026:8.49}},
{id:11,name:"Coca-Cola",brand:"Coca-Cola",size:"1,5 l",cat:"Getränke",prices:{2008:1.29,2010:1.39,2013:1.49,2015:1.59,2020:1.69,2023:1.99,2026:2.29}},
{id:12,name:"Kartoffeln",brand:"Speisekartoffeln",size:"2,5 kg",cat:"Obst & Gemüse",prices:{2008:1.99,2010:2.09,2013:2.29,2015:2.39,2020:2.49,2023:3.29,2026:3.49}}
];
let cart={}, category="Alle";
const fmt=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const cats=["Alle",...new Set(products.map(p=>p.cat))];
function renderCats(){catsEl.innerHTML=cats.map(c=>`<button class="cat ${c===category?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("")}
function renderProducts(){const q=search.value.toLowerCase(),s=store.value;let list=products.filter(p=>(category==="Alle"||p.cat===category)&&(!q||[p.name,p.brand,p.size,p.cat].join(" ").toLowerCase().includes(q))&&(s==="Alle Händler"||p.brand===s||p.brand==="REWE"&&s==="REWE"));productsEl.innerHTML=list.length?list.map(p=>`<article class="product"><div><h3>${p.name}</h3><div class="muted">${p.brand} · ${p.size}</div><div class="muted">${fmt(p.prices[year.value]||p.prices[2013])} · Demo-Daten</div></div><button class="add" onclick="add(${p.id})">+ Hinzufügen</button></article>`).join(""):'<div class="empty">Keine Produkte gefunden.</div>'}
function add(id){cart[id]=(cart[id]||0)+1;renderCart()}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
function renderCart(){const y=+year.value;let old=0,now=0;let rows=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id==id),a=p.prices[y]||p.prices[2013],b=p.prices[2026];old+=a*q;now+=b*q;return `<div class="row"><div><strong>${p.name}</strong><div class="muted">${p.size}</div></div><div class="qty"><button onclick="change(${id},-1)">−</button><span>${q}</span><button onclick="change(${id},1)">+</button></div><div class="price">${fmt(a*q)}<br><span class="muted">heute ${fmt(b*q)}</span></div></div>`}).join("");cartEl.innerHTML=rows||'<div class="empty">Noch leer. Suche ein Produkt und füge es hinzu.</div>';if(rows)cartEl.innerHTML+=`<div class="summary"><div class="sumline"><span>${y}</span><strong>${fmt(old)}</strong></div><div class="sumline"><span>2026</span><strong class="big">${fmt(now)}</strong></div><div class="delta"><strong>+${fmt(now-old)}</strong> · ${old?((now/old-1)*100).toFixed(1):0} % gegenüber ${y}</div><div class="source">Hinweis: Die aktuellen Produktpreise und historischen Werte sind in diesem Prototyp Demo-/Beispieldaten. Sie werden später durch belegte historische Quellen ersetzt.</div></div>`}
}
function setCat(c){category=c;renderCats();renderProducts()}
const search=document.getElementById("search"),year=document.getElementById("year"),store=document.getElementById("store"),catsEl=document.getElementById("cats"),productsEl=document.getElementById("products"),cartEl=document.getElementById("cart");
search.oninput=renderProducts;year.onchange=()=>{renderProducts();renderCart()};store.onchange=renderProducts;renderCats();renderProducts();renderCart();
</script>
</body></html>
