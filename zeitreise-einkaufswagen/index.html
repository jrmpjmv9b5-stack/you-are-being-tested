<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeitreise-Einkaufswagen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#20231f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#173b2a;color:white;padding:22px max(18px,calc((100% - 1180px)/2))}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;color:#c9d9cf}
.wrap{max-width:1180px;margin:auto;padding:20px 16px 50px}.controls{display:grid;grid-template-columns:1.4fr .7fr .7fr;gap:10px;margin-bottom:18px}
input,select,button{font:inherit}input,select{width:100%;padding:13px 14px;border:1px solid #ccd1cc;border-radius:10px;background:white}
.layout{display:grid;grid-template-columns:1fr 390px;gap:18px}.panel{background:white;border:1px solid #dddeda;border-radius:14px;padding:16px}
.categories{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.cat{border:1px solid #ccd1cc;background:white;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer}.cat.active{background:#173b2a;color:white;border-color:#173b2a}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid #e0e2de;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:10px}.product h3{font-size:15px;margin:0 0 4px}.muted{color:#70766f;font-size:12px}.add{border:0;background:#173b2a;color:white;border-radius:9px;padding:8px 12px;cursor:pointer;align-self:center}
.cart{position:sticky;top:12px}.cart h2{margin-top:0}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eceeea}.qty{display:flex;align-items:center;gap:5px}.qty button{width:30px;height:30px;border:1px solid #ccd1cc;background:white;border-radius:7px}.price{text-align:right}.summary{margin-top:14px}.sumline{display:flex;justify-content:space-between;margin:8px 0}.big{font-size:27px;font-weight:700}.delta{background:#f0f4ef;border-radius:10px;padding:12px;margin-top:12px}.info{font-size:12px;color:#667066;margin:0 0 12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.stat{background:#eef2ee;border-radius:9px;padding:8px 10px;font-size:12px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf1ed;font-size:10px;margin-top:5px}.warn{background:#fff5df}.source{font-size:10px;color:#7b817a;margin-top:12px;line-height:1.4}.empty{padding:28px;text-align:center;color:#7a8079}
@media(max-width:850px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}
</style>
</head>
<body>
<header><div><h1>🛒 Zeitreise-Einkaufswagen</h1><p>Was kostete derselbe Einkauf damals – und was kostet er heute?</p></div></header>
<main class="wrap">
<section class="controls">
<input id="search" placeholder="Produkt suchen, z. B. Milch, Butter, Nutella …">
<select id="year"></select>
<select id="store"><option value="ALL">Ø alle Händler</option><option>REWE</option><option>EDEKA</option><option>Aldi</option><option>Lidl</option><option>Kaufland</option><option>Penny</option><option>Netto</option></select>
</section><p class="info">Echte, öffentlich gemeldete Preisbeobachtungen. „Ø alle Händler“ bildet das Mittel der vorhandenen Meldungen des Jahres. Fehlende Jahre werden nicht erfunden.</p><div class="stats" id="stats"></div>
<div class="layout">
<section class="panel"><div class="categories" id="cats"></div><div class="products" id="products"></div></section>
<aside class="panel cart"><h2>Dein Warenkorb</h2><div id="cart"></div></aside>
</div>
</main>
<script src="data.js"></script><script>
const products=priceDB.products,years=Array.from({length:19},(_,i)=>2008+i);
const search=document.getElementById("search"),year=document.getElementById("year"),store=document.getElementById("store"),catsEl=document.getElementById("cats"),productsEl=document.getElementById("products"),cartEl=document.getElementById("cart"),statsEl=document.getElementById("stats");
year.innerHTML=years.map(y=>`<option value="${y}" ${y===2026?"selected":""}>${y}</option>`).join("");
let cart={},category="Alle";const fmt=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});const cats=["Alle",...new Set(products.map(p=>p.cat))];
function group(s){s=(s||"").toLowerCase();if(s.includes("rewe")||s.includes("nahkauf"))return"REWE";if(s.includes("edeka")||s.includes("marktkauf")||s.includes("diska")||s.includes("np discount")||s.includes("e aktiv"))return"EDEKA";if(s.includes("aldi"))return"Aldi";if(s.includes("lidl"))return"Lidl";if(s.includes("kaufland"))return"Kaufland";if(s.includes("penny"))return"Penny";if(s.includes("netto"))return"Netto";return s}
function observations(p,y,s){let a=p.obs.filter(o=>o[0].startsWith(String(y)));if(s!=="ALL")a=a.filter(o=>group(o[1])===s);return a}
function priceInfo(p,y,s){let a=observations(p,y,s),exact=s==="ALL"||a.length>0;if(!a.length&&s!=="ALL"){a=observations(p,y,"ALL");exact=false}if(!a.length)return null;return{price:a.reduce((x,o)=>x+o[2],0)/a.length,count:a.length,exact}}
function renderCats(){catsEl.innerHTML=cats.map(c=>`<button class="cat ${c===category?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("")}
function renderStats(){const y=+year.value,s=store.value,obs=products.flatMap(p=>observations(p,y,s));statsEl.innerHTML=`<div class="stat"><b>${y}</b>: ${obs.length} Preisbeobachtungen</div><div class="stat"><b>${products.filter(p=>priceInfo(p,y,s)).length}</b> Produkte mit Daten</div><div class="stat">Quelle: SupermarktCheck</div>`}
function renderProducts(){const q=search.value.toLowerCase(),y=+year.value,s=store.value,list=products.filter(p=>(category==="Alle"||p.cat===category)&&(!q||[p.name,p.brand,p.size,p.cat].join(" ").toLowerCase().includes(q)));productsEl.innerHTML=list.length?list.map(p=>{const i=priceInfo(p,y,s);return `<article class="product"><div><h3>${p.name}</h3><div class="muted">${p.brand} · ${p.size}</div>${i?`<div><strong>${fmt(i.price)}</strong> <span class="muted">${i.exact&&s!=="ALL"?s:"Ø gemeldete Preise"} · ${i.count} Meldung${i.count===1?"":"en"}</span></div>${!i.exact&&s!=="ALL"?'<span class="badge warn">kein Händlerpreis – Ø verwendet</span>':''}`:'<span class="badge warn">keine Daten für dieses Jahr</span>'}</div><button class="add" ${i?'':'disabled'} onclick="add(${p.id})">+ Hinzufügen</button></article>`}).join(""):'<div class="empty">Keine Produkte gefunden.</div>';renderStats()}
function add(id){cart[id]=(cart[id]||0)+1;renderCart()}function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
function renderCart(){const y=+year.value,s=store.value;let old=0,now=0,rows="";Object.entries(cart).forEach(([id,q])=>{const p=products.find(x=>x.id==id),a=priceInfo(p,y,s),b=priceInfo(p,2026,s);if(!a||!b)return;old+=a.price*q;now+=b.price*q;rows+=`<div class="row"><div><strong>${p.name}</strong><div class="muted">${p.size}</div></div><div class="qty"><button onclick="change(${id},-1)">−</button><span>${q}</span><button onclick="change(${id},1)">+</button></div><div class="price">${fmt(a.price*q)}<br><span class="muted">2026 ${fmt(b.price*q)}</span></div></div>`});cartEl.innerHTML=rows||'<div class="empty">Noch leer. Füge Produkte hinzu, für die im gewählten Jahr Daten vorhanden sind.</div>';if(rows)cartEl.innerHTML+=`<div class="summary"><div class="sumline"><span>${y}</span><strong>${fmt(old)}</strong></div><div class="sumline"><span>2026</span><strong class="big">${fmt(now)}</strong></div><div class="delta"><strong>${fmt(now-old)}</strong> · ${old?((now/old-1)*100).toFixed(1):0} % gegenüber ${y}</div><div class="source">Datenbasis: beobachtete Europreise. Bei Händlerauswahl wird bei fehlender Händlerbeobachtung transparent auf den Jahres-Ø zurückgegriffen.</div></div>`}
}
function setCat(c){category=c;renderCats();renderProducts()}search.oninput=renderProducts;year.onchange=()=>{renderProducts();renderCart()};store.onchange=()=>{renderProducts();renderCart()};renderCats();renderProducts();renderCart();
</script>
</body></html>
