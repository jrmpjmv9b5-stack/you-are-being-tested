  if(s.includes("penny"))return"Penny";
  if(s.includes("netto"))return"Netto";
  return"Sonstiger Händler";
}
function exactInfo(p,y,s){
  const a=(p.obs||[]).filter(o=>o[0].startsWith(String(y))&&(s==="ALL"||group(o[1])===s));
  if(!a.length)return null;
  return {price:a.reduce((n,o)=>n+Number(o[2]),0)/a.length,count:a.length};
}
function money(n){return Number(n).toLocaleString("de-DE",{style:"currency",currency:"EUR"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function fillSelects(){
  catSelect.innerHTML='<option>Alle Kategorien</option>'+[...new Set(products.map(p=>p.cat))].sort().map(c=>'<option>'+esc(c)+'</option>').join("");
  ["A","B"].forEach((x,i)=>{
    const y=$("year"+x),s=$("store"+x);
    y.innerHTML=years.map(v=>'<option value="'+v+'" '+(v===(i?2026:2008)?"selected":"")+'>'+v+'</option>').join("");
    s.innerHTML=stores.map(v=>'<option value="'+v+'">'+(v==="ALL"?"Ø alle Händler":v)+'</option>').join("");
  });
}
function statusHtml(p,which){
  const y=Number($("year"+which).value),s=$("store"+which).value,i=exactInfo(p,y,s);
  if(!i)return '<span class="no">✕ '+which+' · '+y+' · '+(s==="ALL"?"alle Händler":esc(s))+': kein Preis</span>';
  return '<span class="ok">✓ '+which+' · '+y+' · '+(s==="ALL"?"Ø alle Händler":esc(s))+': '+money(i.price)+' <span class="muted">('+i.count+' Beob.)</span></span>';
}
function renderResults(){
  const q=search.value.trim().toLowerCase(),cat=catSelect.value;
  const list=products.filter(p=>
    (!q||[p.name,p.brand,p.size,p.cat].join(" ").toLowerCase().includes(q)) &&
    (cat==="Alle Kategorien"||p.cat===cat)
  );
  if(!q&&cat==="Alle Kategorien"){
    results.innerHTML='<div class="empty">Suche z. B. <b>Milch</b> und du bekommst alle passenden Produkte und Varianten.</div>';
    stats.textContent=products.length+" Produkte in der aktuellen Datenbasis.";
    return;
  }
  results.innerHTML=list.length?list.map(p=>
    '<div class="result"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.brand||"")+" · "+esc(p.size||"")+" · "+esc(p.cat)+'</div><div class="statusline">'+statusHtml(p,"A")+statusHtml(p,"B")+'</div></div><div class="addrow"><button class="add" onclick="addTo(\'A\','+p.id+')">+ zu A</button><button class="add" onclick="addTo(\'B\','+p.id+')">+ zu B</button></div></div>'
  ).join(""):'<div class="empty">Keine passenden Produkte gefunden.</div>';
  stats.textContent=list.length+" passende Produkte / Varianten. Preisstatus bezieht sich direkt auf Jahr + Händler des jeweiligen Warenkorbs.";
}
function addTo(which,id){carts[which][id]=(carts[which][id]||0)+1;renderCarts()}
function change(which,id,d){carts[which][id]=(carts[which][id]||0)+d;if(carts[which][id]<=0)delete carts[which][id];renderCarts()}
window.addTo=addTo;window.change=change;

function renderCart(which){
  const y=Number($("year"+which).value),s=$("store"+which).value;
  let total=0,priced=0,unpriced=0,html="";
  Object.entries(carts[which]).forEach(([id,q])=>{
    const p=products.find(x=>x.id==id),i=exactInfo(p,y,s);
    if(!i){
      unpriced++;
      html+='<div class="cartrow unavailable"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.brand||"")+" · "+esc(p.size||"")+'</div><div class="no">✕ Keine Preisdaten für '+y+' bei '+(s==="ALL"?"den erfassten Händlern":esc(s))+'</div></div><div class="qty"><button onclick="change(\''+which+'\','+id+',-1)">−</button><b>'+q+'</b><button onclick="change(\''+which+'\','+id+',1)">+</button></div><strong>—</strong></div>';
      return;
    }
    priced++;
    total+=i.price*q;
    html+='<div class="cartrow"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.brand||"")+" · "+esc(p.size||"")+'</div><div>'+money(i.price)+' je Einheit</div></div><div class="qty"><button onclick="change(\''+which+'\','+id+',-1)">−</button><b>'+q+'</b><button onclick="change(\''+which+'\','+id+',1)">+</button></div><strong>'+money(i.price*q)+'</strong></div>';
  });
  $("cart"+which).innerHTML=html||'<div class="empty">Noch leer.</div>';
  if(priced)$("cart"+which).innerHTML+='<div class="total">'+money(total)+'</div>';
  if(unpriced)$("cart"+which).innerHTML+='<div class="warning">'+unpriced+' Position(en) haben für '+y+' / '+(s==="ALL"?"Ø alle Händler":esc(s))+' keinen erfassten Preis und werden NICHT in die Summe eingerechnet.</div>';
  return {total,priced,unpriced};
}
function renderCarts(){
  const a=renderCart("A"),b=renderCart("B"),d=b.total-a.total;
  $("comparison").innerHTML='<b>Vergleich der Warenkörbe</b><div class="comparegrid"><div class="comparebox"><b>A · '+$("yearA").value+'</b><br>'+money(a.total)+'<div class="muted">'+a.priced+' bepreist · '+a.unpriced+' ohne Preis</div></div><div class="comparebox"><b>B · '+$("yearB").value+'</b><br>'+money(b.total)+'<div class="muted">'+b.priced+' bepreist · '+b.unpriced+' ohne Preis</div></div><div class="comparebox"><b>Differenz B − A</b><br>'+money(d)+'<div class="muted">'+(a.unpriced||b.unpriced?"nur auf Basis der bepreisten Positionen":"vollständig bepreist")+'</div></div></div>';
}
search.oninput=renderResults;catSelect.onchange=renderResults;
["A","B"].forEach(x=>{$("year"+x).onchange=()=>{renderResults();renderCarts()};$("store"+x).onchange=()=>{renderResults();renderCarts()}});
fillSelects();renderResults();renderCarts();
})();
</script></body></html>
