<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HANNOVER / WEATHER</title>
<style>
:root{--bg:#07100f;--fg:#f0eadc;--muted:#87938d;--line:#2d4039;--accent:#d2b57d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}body{min-height:100dvh;overflow-x:hidden}.app{max-width:1500px;margin:auto;min-height:100dvh;padding:22px clamp(18px,4vw,54px)}header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{font:clamp(28px,4vw,58px)/.9 Georgia,serif;letter-spacing:-2px}.brand small{display:block;font:8px/1.2 system-ui;letter-spacing:4px;color:var(--accent);margin-bottom:9px}.status{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-align:right}.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c9a66d;margin-right:7px;box-shadow:0 0 14px #c9a66d}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;margin-top:28px}.map{position:relative;min-height:570px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#17342c,#0b1714 58%,#07100f)}svg{width:100%;height:100%;position:absolute;inset:0}.map-title{position:absolute;left:22px;top:20px;font-size:8px;letter-spacing:3px;color:var(--muted)}.map-note{position:absolute;right:22px;bottom:18px;font-size:8px;color:#66746e;letter-spacing:1px}.weather{display:flex;flex-direction:column;justify-content:center;padding:10px}.place{font-size:9px;letter-spacing:4px;color:var(--accent);text-transform:uppercase}.temp{font:clamp(90px,13vw,170px)/.8 Georgia,serif;letter-spacing:-9px;margin:16px 0}.condition{font:18px Georgia,serif}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.meta div{padding:16px 8px}.meta b{display:block;font:18px Georgia,serif}.meta span{font-size:7px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}.timeline{margin-top:28px}.timeline-head{display:flex;justify-content:space-between;font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.timeline input{width:100%;margin:16px 0;accent-color:var(--accent)}.hours{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.hour{border:1px solid var(--line);padding:12px 8px;border-radius:12px;text-align:center}.hour strong{display:block;font:16px Georgia,serif}.hour span{display:block;font-size:8px;color:var(--muted);margin-top:6px}.places{margin-top:34px}.section-title{font-size:8px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card{background:#0b1714;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.2s}.card:hover,.card.active{border-color:#756445;transform:translateY(-2px)}.card h3{font:18px Georgia,serif;margin:0 0 8px}.card .c-temp{font-size:25px}.card p{font-size:8px;color:var(--muted);margin:5px 0 0}.rain{margin-top:30px;padding:18px;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:18px}.rainbar{height:5px;flex:1;background:#182722;border-radius:10px;overflow:hidden}.rainbar i{display:block;height:100%;width:28%;background:var(--accent);animation:rain 4s linear infinite}@keyframes rain{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}.wind{position:absolute;inset:0;pointer-events:none;overflow:hidden}.wind i{position:absolute;width:70px;height:1px;background:#d8d0c0;opacity:.12;animation:flow linear infinite}@keyframes flow{from{transform:translateX(-120px)}to{transform:translateX(900px)}}.error{color:#d7a889;font-size:11px;margin-top:20px}@media(max-width:900px){.hero{grid-template-columns:1fr}.map{min-height:430px}.weather{padding:18px 4px}.cards{grid-template-columns:repeat(2,1fr)}.hours{grid-template-columns:repeat(4,1fr)}.temp{font-size:105px}}@media(max-width:520px){.app{padding:17px}.map{min-height:390px;border-radius:20px}.cards{grid-template-columns:repeat(2,1fr)}.card h3{font-size:15px}.meta b{font-size:15px}}
</style>
</head>
<body><main class="app">
<header><div class="brand"><small>REGION HANNOVER / LIVE</small>HANNOVER<br>WEATHER</div><div class="status"><span class="live"></span><span id="updated">verbinde...</span></div></header>
<section class="hero"><div class="map"><div class="map-title">LIVE REGIONAL MAP / 20 LOCATIONS</div><div class="wind" id="wind"></div><svg viewBox="0 0 700 650" aria-label="Stilisierte Wetterkarte der Region Hannover"><defs><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs><path d="M125 120 Q280 45 455 95 Q595 135 590 275 Q625 410 500 525 Q360 615 205 535 Q75 470 95 315 Q65 195 125 120Z" fill="#0c1b17" stroke="#355148" stroke-width="2"/><path d="M95 320 Q210 270 335 295 T605 260 M175 120 Q225 230 205 535 M455 95 Q405 240 500 525 M100 430 Q280 390 580 420" fill="none" stroke="#203a32" stroke-width="1"/><path d="M105 365 Q260 300 400 335 T590 300" fill="none" stroke="#bda474" stroke-width="1" stroke-dasharray="3 10" opacity=".45"/><g id="points"></g></svg><div class="map-note">DATA / OPEN-METEO · AUTOMATIC REFRESH</div></div>
<div class="weather"><div class="place" id="place">HANNOVER</div><div class="temp" id="temp">—°</div><div class="condition" id="condition">Wetter wird geladen</div><div class="meta"><div><b id="feels">—°</b><span>gefühlte temp.</span></div><div><b id="windv">—</b><span>wind km/h</span></div><div><b id="rainp">—%</b><span>regen</span></div></div><div class="timeline"><div class="timeline-head"><span>Forecast</span><span id="day">Heute</span></div><input id="slider" type="range" min="0" max="7" value="0"><div class="hours" id="hours"></div></div></div></section>
<section class="places"><div class="section-title">Region / Orte</div><div class="cards" id="cards"></div></section>
<div class="rain"><span style="font-size:8px;letter-spacing:2px;color:var(--muted)">ATMOSPHERE</span><div class="rainbar"><i></i></div><span id="atmo" style="font:16px Georgia,serif">live</span></div>
<div id="error" class="error"></div>
</main>
<script>
const places=[['Hannover',52.3759,9.7320],['Langenhagen',52.447,9.743],['Garbsen',52.426,9.600],['Wunstorf',52.423,9.427],['Neustadt',52.505,9.462],['Burgwedel',52.500,9.863],['Lehrte',52.375,9.980],['Burgdorf',52.447,10.006],['Laatzen',52.315,9.797],['Barsinghausen',52.300,9.460],['Springe',52.208,9.552],['Seelze',52.397,9.598],['Wedemark',52.545,9.733],['Isernhagen',52.480,9.840],['Ronnenberg',52.319,9.655],['Hemmingen',52.322,9.742],['Pattensen',52.265,9.768],['Gehrden',52.313,9.600],['Wennigsen',52.275,9.570],['Uetze',52.465,10.205]];
let data={},selected=0,forecast=[];
const weatherCode=c=>({0:'klar',1:'überwiegend klar',2:'leicht bewölkt',3:'bedeckt',45:'Nebel',48:'Nebel',51:'leichter Niesel',53:'Nieselregen',55:'Nieselregen',61:'leichter Regen',63:'Regen',65:'starker Regen',71:'leichter Schnee',73:'Schnee',75:'starker Schnee',80:'Regenschauer',81:'Regenschauer',82:'starke Schauer',95:'Gewitter',96:'Gewitter',99:'Gewitter'})[c]||'wechselhaft';
async function load(){try{const qs=places.map(p=>`${p[1]},${p[2]}`).join('|');const url='https://api.open-meteo.com/v1/forecast?latitude='+places.map(p=>p[1]).join(',')+'&longitude='+places.map(p=>p[2]).join(',')+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=1&timezone=Europe%2FBerlin';const r=await fetch(url);if(!r.ok)throw Error('API');const j=await r.json();const arr=Array.isArray(j)?j:[j];arr.forEach((x,i)=>data[i]=x);render();document.getElementById('updated').textContent='live · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent='Live-Daten konnten nicht geladen werden. Die Seite benötigt eine Internetverbindung.'}}
function render(){const x=data[selected];if(!x)return;const c=x.current;document.getElementById('place').textContent=places[selected][0].toUpperCase();document.getElementById('temp').textContent=Math.round(c.temperature_2m)+'°';document.getElementById('condition').textContent=weatherCode(c.weather_code);document.getElementById('feels').textContent=Math.round(c.apparent_temperature)+'°';document.getElementById('windv').textContent=Math.round(c.wind_speed_10m);document.getElementById('rainp').textContent=Math.round(c.precipitation||0)+' mm';forecast=x.hourly;drawHours(0);drawPoints();document.getElementById('atmo').textContent=weatherCode(c.weather_code);document.querySelectorAll('.card').forEach((e,i)=>e.classList.toggle('active',i===selected))}
function drawHours(offset){const x=data[selected];if(!x)return;const now=new Date();let idx=x.hourly.time.findIndex(t=>new Date(t)>=now);idx=Math.max(0,idx)+offset;const h=document.getElementById('hours');h.innerHTML='';for(let k=0;k<8;k++){let i=Math.min(idx+k,x.hourly.time.length-1);let t=new Date(x.hourly.time[i]);h.innerHTML+=`<div class="hour"><strong>${Math.round(x.hourly.temperature_2m[i])}°</strong><span>${t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</span><span>${x.hourly.precipitation_probability[i]||0}% rain</span></div>`}}
function drawPoints(){const g=document.getElementById('points');g.innerHTML='';places.forEach((p,i)=>{let x=90+(p[2]-9.42)*2500,y=500-(p[1]-52.20)*2500; x=Math.max(105,Math.min(595,x));y=Math.max(90,Math.min(545,y));const active=i===selected;g.innerHTML+=`<g transform="translate(${x},${y})" style="cursor:pointer" onclick="selectPlace(${i})"><circle r="${active?13:7}" fill="#d2b57d" opacity="${active?.12:.06}" filter="url(#glow)"/><circle r="${active?5:3}" fill="${active?'#f0eadc':'#9aa79f'}"/><text x="9" y="3" fill="${active?'#f0eadc':'#819089'}" font-size="${active?11:8}">${p[0]}</text></g>`})}
function selectPlace(i){selected=i;render()}
document.getElementById('slider').addEventListener('input',e=>drawHours(+e.target.value));
const cards=document.getElementById('cards');places.slice(0,10).forEach((p,i)=>cards.innerHTML+=`<article class="card" onclick="selectPlace(${i})"><h3>${p[0]}</h3><div class="c-temp" id="ct${i}">—°</div><p id="cc${i}">lädt...</p></article>`);
const w=document.getElementById('wind');for(let i=0;i<18;i++){const el=document.createElement('i');el.style.top=(8+Math.random()*86)+'%';el.style.left=(-10+Math.random()*90)+'%';el.style.animationDuration=(5+Math.random()*7)+'s';el.style.animationDelay=(-Math.random()*8)+'s';w.appendChild(el)}
const oldRender=render;render=function(){oldRender();places.slice(0,10).forEach((p,i)=>{if(data[i]){document.getElementById('ct'+i).textContent=Math.round(data[i].current.temperature_2m)+'°';document.getElementById('cc'+i).textContent=weatherCode(data[i].current.weather_code)}})};
load();setInterval(load,300000);
</script></body></html>
