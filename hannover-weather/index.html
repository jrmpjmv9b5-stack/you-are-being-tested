<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="description" content="Hannover Wetter — aktuelle Wetterdaten, Radar und Prognose für Hannover und die Region.">
<title>Hannover Wetter — Region live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=23">
<link rel="stylesheet" href="./enhancements.css?v=23">
<link rel="stylesheet" href="./visuals.css?v=23">
<style>
.placeScene{height:178px!important;position:relative!important;overflow:hidden!important;isolation:isolate!important;background:#9fc9dc!important}
.placeScene>*{visibility:hidden}.placeScene>.weather-art{visibility:visible!important}.placeScene>.weather-art *{visibility:visible}
.placeScene .landmark,.placeScene .miniCity,.placeScene .sceneGlow,.placeScene .sceneGround,.placeScene .sceneSkyline,.placeScene .sceneLabel,.placeScene .sceneWeather,.placeScene .miniSun,.placeScene .miniBird,.placeScene .miniBolt,.placeScene .miniRain,.placeScene .miniSnow,.placeScene .weatherParticles,.placeScene .weatherClouds,.placeScene .birds,.placeScene .lightning{display:none!important}
.weather-art{position:absolute;inset:0;z-index:20!important;display:block!important;color:#263b3a;font-family:Arial,sans-serif}
.weather-art .sky{position:absolute;inset:0;background:linear-gradient(180deg,#82bdd7 0%,#cfe4e5 57%,#a8b991 58%,#60775a 100%)}
.weather-art .sun{position:absolute;right:12%;top:12%;width:38px;height:38px;border-radius:50%;background:#ffe39a;box-shadow:0 0 0 9px #ffe39a22,0 0 35px #fff2b077}
.weather-art .sun:after{content:'';position:absolute;inset:-16px;border-radius:50%;background:#fff4b622;animation:waPulse 4s ease-in-out infinite}
.weather-art .cloud{position:absolute;width:100px;height:28px;border-radius:30px;background:#fff8;top:18%;left:-120px;animation:waCloud 20s linear infinite}
.weather-art .cloud:before,.weather-art .cloud:after{content:'';position:absolute;border-radius:50%;background:inherit}.weather-art .cloud:before{width:40px;height:40px;left:15px;top:-18px}.weather-art .cloud:after{width:52px;height:45px;right:12px;top:-23px}
.weather-art .ground{position:absolute;left:-10%;right:-10%;bottom:-18%;height:48%;background:linear-gradient(170deg,#81966d,#465c44);transform:skewY(-3deg)}
.weather-art .trees{position:absolute;left:5%;right:5%;bottom:19%;height:30%}.weather-art .trees i{position:absolute;bottom:0;width:24px;height:55px;background:#4d704d;clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.85}.weather-art .trees i:nth-child(1){left:5%}.weather-art .trees i:nth-child(2){right:7%;transform:scale(.7)}.weather-art .trees i:nth-child(3){left:42%;transform:scale(.55)}
.weather-art svg{position:absolute;left:0;right:0;bottom:13%;width:100%;height:74%;z-index:5}.weather-art svg g{stroke:#29403f;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.weather-art .building{fill:#e8ddc8}.weather-art .glass{fill:#9dbfc6}.weather-art .water{fill:#72aab0;stroke:#315c61}.weather-art .green{fill:#63845b;stroke:#314c37}.weather-art .wood{fill:#cbb28d}.weather-art .label{position:absolute;left:13px;bottom:10px;color:#fff;text-shadow:0 2px 5px #17261dcc;z-index:30;font-size:11px;font-weight:700}.weather-art .label small{display:block;margin-top:2px;font:6px 'DM Mono',monospace;letter-spacing:.1em;opacity:.9}
.weather-art.rain .sky{background:linear-gradient(180deg,#7896a6,#b4c0c2 57%,#8a987f 58%,#586b55)}.weather-art.rain .sun{opacity:.18}.weather-art.snow .sky{background:linear-gradient(180deg,#a9c7da,#edf3f1 57%,#dce5dc 58%,#c5d0c6)}.weather-art.storm .sky{background:linear-gradient(180deg,#304657,#69787c 57%,#4b5947 58%,#303c32)}.weather-art.cloudy .sun{opacity:.35}.weather-art.night .sky{background:linear-gradient(180deg,#293f54,#6a7b82 57%,#455341 58%,#303b32)}.weather-art.night .sun{background:#eef0d4}
.weather-art .rain{position:absolute;inset:0;z-index:25;pointer-events:none}.weather-art .rain i{position:absolute;width:2px;height:20px;background:#fff9;transform:rotate(16deg);animation:waRain .75s linear infinite}.weather-art .rain i:nth-child(1){left:15%;top:-30px}.weather-art .rain i:nth-child(2){left:39%;top:-70px;animation-delay:-.2s}.weather-art .rain i:nth-child(3){left:64%;top:-20px;animation-delay:-.45s}.weather-art .rain i:nth-child(4){left:87%;top:-90px;animation-delay:-.6s}
.weather-art .snow{position:absolute;inset:0;z-index:25;color:#fff;font-size:13px;letter-spacing:12px;padding:15px;animation:waSnow 4s linear infinite}.weather-art .flash{position:absolute;right:25%;top:7%;z-index:25;width:28px;height:62px;background:#fff;clip-path:polygon(45% 0,100% 0,66% 38%,92% 38%,20% 100%,42% 50%,8% 50%);animation:waFlash 5s infinite}
@keyframes waRain{to{transform:translateY(210px) rotate(16deg);opacity:0}}@keyframes waSnow{to{transform:translateY(160px);opacity:0}}@keyframes waCloud{to{transform:translateX(430px)}}@keyframes waPulse{50%{transform:scale(1.12);opacity:.45}}@keyframes waFlash{0%,86%,100%{opacity:0}89%,91%{opacity:1}92%{opacity:0}}
@media(max-width:760px){.placeScene{height:165px!important}.weather-art svg{height:78%;bottom:10%}.weather-art .label{left:10px;bottom:9px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app.js?v=23"></script>
<script src="./radar.js?v=23"></script>
<script>
(()=>{
const ART={
 rathaus:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="building"><rect x="40" y="72" width="140" height="70" rx="3"/><path d="M45 72l20-34 20 34M135 72l20-34 20 34"/><path d="M91 72V31l19-17 19 17v41"/><circle cx="110" cy="36" r="7" fill="#c7bba5"/><path d="M80 72l30-25 30 25"/></g></svg>`,
 airport:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="building"><path d="M28 130h164M48 112h124l-34-25H82z"/><path d="M110 108V32M110 52L52 72M110 52l58 20"/><rect x="104" y="25" width="12" height="10"/></g></svg>`,
 lake:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="water"><path d="M0 118Q55 90 110 118T220 118v32H0z"/><path d="M58 110l12-34 12 34M92 110l14-42 14 42" fill="#6b895f"/><path d="M22 115h176" fill="none"/></g></svg>`,
 church:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="building"><rect x="58" y="66" width="104" height="76"/><path d="M48 66l62-43 62 43M88 66V18h44v48M106 18V7h8v11"/><circle cx="110" cy="49" r="10" fill="#b9c4bf"/></g></svg>`,
 castle:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="building"><rect x="42" y="63" width="136" height="79"/><rect x="25" y="45" width="30" height="97"/><rect x="165" y="45" width="30" height="97"/><path d="M21 45l19-19 19 19M161 45l19-19 19 19"/><path d="M82 142V91h56v51"/></g></svg>`,
 tower:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="building"><path d="M90 142l10-102h20l10 102z"/><path d="M96 40h28l-8-16h-12z"/><rect x="103" y="14" width="14" height="12"/></g></svg>`,
 garden:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="green"><path d="M20 142Q60 76 110 112Q155 70 200 142"/><circle cx="110" cy="82" r="17" fill="#d7a55b"/><path d="M110 99v43M56 121l108-28M58 138l100-40" fill="none"/></g></svg>`,
 monastery:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="building"><rect x="30" y="64" width="160" height="78"/><path d="M30 64h160M48 64V44h20v20M82 64V44h20v20M116 64V44h20v20M150 64V44h20v20"/><path d="M86 142V92h48v50"/></g></svg>`,
 windmill:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="wood"><path d="M91 142l9-91h20l9 91z"/><path d="M110 52L52 27M110 52l58-25M110 52l24 56M110 52l-24 56" fill="none"/><circle cx="110" cy="52" r="8"/></g></svg>`,
 half:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="wood"><path d="M55 142V67l55-40 55 40v75z"/><path d="M55 67h110M110 27v115M72 53l38 28 38-28M72 114l38-33 38 33" fill="none"/></g></svg>`,
 hill:`<svg viewBox="0 0 220 150" preserveAspectRatio="xMidYMid meet"><g class="green"><path d="M0 142Q45 78 88 110Q130 45 220 142z"/><path d="M150 100v42M143 100h14l-7-14z" fill="#c6b596"/></g></svg>`
};
const map={Hannover:'rathaus',Langenhagen:'airport',Garbsen:'lake',Wunstorf:'church',Neustadt:'castle',Burgwedel:'church',Lehrte:'tower',Burgdorf:'castle',Laatzen:'garden',Barsinghausen:'monastery',Springe:'castle',Seelze:'lake',Wedemark:'half',Isernhagen:'half',Ronnenberg:'hill',Hemmingen:'church',Pattensen:'castle',Gehrden:'tower',Wennigsen:'monastery',Uetze:'windmill'};
function sceneType(s){const n=s.closest('.place')?.querySelector('.placeInfo strong')?.textContent?.trim();return [n,map[n]||'church'];}
function make(s){if(!s||s.dataset.cleanArt)return;const n=sceneType(s),name=n[0],type=n[1];s.innerHTML=`<div class="weather-art"><div class="sky"></div><div class="sun"></div><div class="cloud"></div><div class="trees"><i></i><i></i><i></i></div><div class="ground"></div>${ART[type]||ART.church}<div class="label">${name}<small>REGION HANNOVER</small></div></div>`;s.dataset.cleanArt='1'}
function all(){document.querySelectorAll('.placeScene').forEach(make)}
new MutationObserver(all).observe(document.body,{childList:true,subtree:true});all();
})();
</script>
</body>
</html>
