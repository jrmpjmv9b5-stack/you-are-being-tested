<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110f">
<title>HANNOVER WETTER — Region live</title>
<style>
:root{--bg:#06100d;--panel:#091713;--panel2:#0d1d17;--ink:#f2ecdc;--soft:#b6b6a8;--dim:#68766f;--line:rgba(190,210,200,.13);--gold:#d8bd84;--mint:#91c5ad;--shadow:0 30px 90px rgba(0,0,0,.42)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100dvh;background:radial-gradient(900px 650px at 50% 12%,#173229 0,#0b1915 42%,#06100d 78%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.grain{position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}.wrap{width:min(1180px,calc(100% - 34px));margin:auto;padding:26px 0 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.eyebrow{font-size:9px;letter-spacing:4px;color:var(--gold);text-transform:uppercase}.brand{margin-top:10px;font-family:Georgia,serif;font-size:clamp(44px,7vw,86px);line-height:.82;letter-spacing:-5px}.live{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding-top:5px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8ed0ac;box-shadow:0 0 18px #8ed0ac;margin-right:7px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}.hero{display:grid;grid-template-columns:1.22fr .78fr;gap:18px}.mapcard{height:660px;border:1px solid var(--line);border-radius:34px;overflow:hidden;position:relative;background:linear-gradient(145deg,#0a1814,#06100d);box-shadow:var(--shadow)}.mapcard:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 52% 48%,rgba(125,188,155,.08),transparent 35%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.34));pointer-events:none}.maphead,.mapfoot{position:absolute;z-index:5;left:30px;right:30px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:4px;font-size:8px;color:#718078}.maphead{top:26px}.mapfoot{bottom:25px}.map{position:absolute;inset:70px 25px 65px}.map svg{width:100%;height:100%;overflow:visible}.region{fill:#081712;stroke:#557066;stroke-width:1.4}.district{fill:none;stroke:#29443b;stroke-width:1}.river{fill:none;stroke:#3e6658;stroke-width:1.2;opacity:.55}.route{fill:none;stroke:#b69b67;stroke-width:1;stroke-dasharray:2 9;opacity:.5}.station text{font-size:8px;fill:#77867e;letter-spacing:.1px}.station .halo{fill:#d8bd84;opacity:.08}.station .pin{fill:#9bb1a7}.station.active .pin{fill:#f2ecdc}.station.active text{fill:#f2ecdc;font-size:10px}.station.active .halo{opacity:.2}.weather{padding:30px 12px 20px;display:flex;flex-direction:column;justify-content:center}.location{font-size:10px;letter-spacing:5px;color:var(--gold);text-transform:uppercase}.temperature{font:clamp(112px,14vw,190px)/.78 Georgia,serif;letter-spacing:-11px;margin:18px 0 13px}.condition{font:22px Georgia,serif;color:#dedbce}.sub{margin-top:7px;font-size:10px;color:var(--dim);letter-spacing:1px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:32px}.stat{padding:17px 7px}.stat b{display:block;font:21px Georgia,serif}.stat span{display:block;margin-top:5px;color:var(--dim);font-size:7px;letter-spacing:2px;text-transform:uppercase}.forecast{margin-top:25px}.forecasthead{display:flex;justify-content:space-between;color:var(--dim);font-size:8px;letter-spacing:3px;text-transform:uppercase}.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:10px}.hour{padding:12px 4px;border:1px solid var(--line);border-radius:12px;text-align:center;background:rgba(255,255,255,.015)}.hour .time{font-size:8px;color:var(--dim)}.hour .t{font:18px Georgia,serif;margin-top:7px}.hour .rain{font-size:7px;color:var(--mint);margin-top:5px}.slider{width:100%;margin-top:13px;accent-color:var(--gold)}.regionsection{margin-top:30px}.sectionline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionline h2{font:24px Georgia,serif;font-weight:400;margin:0}.sectionline span{font-size:8px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.card{border:1px solid var(--line);background:rgba(8,20,16,.76);border-radius:17px;padding:15px;cursor:pointer;transition:.25s;min-height:116px}.card:hover,.card.active{transform:translateY(-3px);border-color:rgba(216,189,132,.55);background:#0d1e18}.card h3{font:18px Georgia,serif;margin:0 0 13px}.card .ct{font:25px Georgia,serif}.card .cc{font-size:8px;color:var(--dim);margin-top:4px;text-transform:capitalize}.card .mini{font-size:7px;color:var(--mint);margin-top:10px}.atmo{margin-top:28px;border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:17px;background:rgba(255,255,255,.015)}.atmo-label{font-size:8px;letter-spacing:3px;color:var(--dim);white-space:nowrap}.bar{height:3px;flex:1;background:#172923;border-radius:10px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scan 4s linear infinite}@keyframes scan{from{transform:translateX(-180%)}to{transform:translateX(420%)}}.atmo-value{font:16px Georgia,serif;min-width:75px;text-align:right}.rainlayer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s;background:repeating-linear-gradient(105deg,transparent 0 15px,rgba(170,205,195,.08) 16px 17px,transparent 18px 30px);animation:rainmove .55s linear infinite}@keyframes rainmove{to{background-position:0 45px}}.storm{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(210,190,130,.15),transparent 25%);transition:opacity .5s}.error{font-size:10px;color:#b88e79;margin-top:16px;min-height:12px}@media(max-width:900px){.wrap{width:min(100% - 24px,700px);padding-top:19px}.top{margin-bottom:18px}.brand{font-size:51px}.hero{grid-template-columns:1fr}.mapcard{height:500px;border-radius:27px}.weather{padding:27px 5px}.temperature{font-size:122px}.cards{grid-template-columns:repeat(2,1fr)}.card:nth-child(n+11){display:none}}@media(max-width:520px){.wrap{width:calc(100% - 20px)}.brand{font-size:45px;letter-spacing:-3px}.live{font-size:7px}.mapcard{height:465px}.maphead,.mapfoot{left:20px;right:20px;font-size:7px;letter-spacing:3px}.map{inset:60px 10px 58px}.station text{font-size:7px}.weather{padding-top:35px}.temperature{font-size:112px;letter-spacing:-8px}.condition{font-size:19px}.stats{margin-top:26px}.hours{grid-template-columns:repeat(3,1fr)}.hours .hour:nth-child(n+7){display:none}.cards{gap:7px}.card{padding:13px;min-height:105px}.card h3{font-size:16px}.atmo{padding:15px}.atmo-label{font-size:7px}}
</style>
</head>
<body><div class="grain"></div><main class="wrap">
<header class="top"><div><div class="eyebrow">Region Hannover · Wetter live</div><div class="brand">HANNOVER<br>WETTER</div></div><div class="live"><span class="dot"></span><span id="updated">verbinde…</span></div></header>
<section class="hero">
<div class="mapcard"><div class="maphead"><span>Regionales Wetterfeld</span><span>20 Orte</span></div><div class="map"><svg viewBox="0 0 720 620" aria-label="Wetterkarte Region Hannover"><defs><filter id="blur"><feGaussianBlur stdDeviation="9"/></filter><radialGradient id="heat"><stop offset="0" stop-color="#c9b078" stop-opacity=".15"/><stop offset="1" stop-color="#c9b078" stop-opacity="0"/></radialGradient></defs><ellipse cx="365" cy="315" rx="190" ry="150" fill="url(#heat)"/><path class="region" d="M112 128 Q265 58 445 84 Q594 105 622 250 Q650 405 523 518 Q378 616 205 535 Q82 474 92 318 Q67 203 112 128Z"/><path class="district" d="M95 318 Q220 260 356 294 T630 254 M166 120 Q222 232 205 535 M451 86 Q404 235 523 518 M103 424 Q278 379 617 413 M290 78 Q315 202 300 584"/><path class="river" d="M370 90 Q345 200 382 290 T350 535 M115 347 Q275 330 610 352"/><path class="route" d="M103 365 Q270 300 410 335 T622 296"/><g id="points"></g></svg></div><div class="rainlayer" id="rainlayer"></div><div class="storm" id="storm"></div><div class="mapfoot"><span>Open-Meteo · DWD Modelle</span><span>Aktualisierung · 5 Min.</span></div></div>
<div class="weather"><div class="location" id="place">Hannover</div><div class="temperature" id="temp">—°</div><div class="condition" id="condition">Wetter wird geladen</div><div class="sub" id="sub">Regionale Messung</div><div class="stats"><div class="stat"><b id="feels">—°</b><span>Gefühlt</span></div><div class="stat"><b id="windv">—</b><span>Wind · km/h</span></div><div class="stat"><b id="rainp">—</b><span>Niederschlag</span></div></div><div class="forecast"><div class="forecasthead"><span>Stundenverlauf</span><span id="day">Heute</span></div><input class="slider" id="slider" type="range" min="0" max="6" value="0"><div class="hours" id="hours"></div></div></div>
</section>
<section class="regionsection"><div class="sectionline"><h2>Rund um Hannover</h2><span>Live · Auswahl</span></div><div class="cards" id="cards"></div></section>
<div class="atmo"><span class="atmo-label">Atmosphäre</span><div class="bar"><i></i></div><span class="atmo-value" id="atmo">live</span></div><div class="error" id="error"></div>
</main>
<script>
const places=[['Hannover',52.3759,9.7320],['Langenhagen',52.447,9.743],['Garbsen',52.426,9.600],['Wunstorf',52.423,9.427],['Neustadt',52.505,9.462],['Burgwedel',52.500,9.863],['Lehrte',52.375,9.980],['Burgdorf',52.447,10.006],['Laatzen',52.315,9.797],['Barsinghausen',52.300,9.460],['Springe',52.208,9.552],['Seelze',52.397,9.598],['Wedemark',52.545,9.733],['Isernhagen',52.480,9.840],['Ronnenberg',52.319,9.655],['Hemmingen',52.322,9.742],['Pattensen',52.265,9.768],['Gehrden',52.313,9.600],['Wennigsen',52.275,9.570],['Uetze',52.465,10.205]];
const names={0:'Klar',1:'Überwiegend klar',2:'Leicht bewölkt',3:'Bedeckt',45:'Nebel',48:'Nebel',51:'Leichter Nieselregen',53:'Nieselregen',55:'Starker Nieselregen',61:'Leichter Regen',63:'Regen',65:'Starker Regen',71:'Leichter Schneefall',73:'Schneefall',75:'Starker Schneefall',80:'Regenschauer',81:'Regenschauer',82:'Starke Regenschauer',95:'Gewitter',96:'Gewitter mit Hagel',99:'Starkes Gewitter'};
let data={},selected=0;
const desc=c=>names[c]||'Wechselhaft';
async function load(){try{const lat=places.map(p=>p[1]).join(','),lon=places.map(p=>p[2]).join(',');const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,relative_humidity_2m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=2&timezone=Europe%2FBerlin`;const r=await fetch(url);if(!r.ok)throw Error('API');const j=await r.json();const arr=Array.isArray(j)?j:[j];arr.forEach((x,i)=>data[i]=x);render();document.getElementById('updated').textContent='live · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent='Live-Daten konnten nicht geladen werden. Internetverbindung prüfen.'}}
function coords(p){let x=95+(p[2]-9.42)*2500,y=525-(p[1]-52.20)*2500;return[Math.max(105,Math.min(615,x)),Math.max(82,Math.min(548,y))]}
function render(){const x=data[selected];if(!x)return;const c=x.current;document.getElementById('place').textContent=places[selected][0];document.getElementById('temp').textContent=Math.round(c.temperature_2m)+'°';document.getElementById('condition').textContent=desc(c.weather_code);document.getElementById('sub').textContent='Feuchte '+Math.round(c.relative_humidity_2m)+' % · Regionale Messung';document.getElementById('feels').textContent=Math.round(c.apparent_temperature)+'°';document.getElementById('windv').textContent=Math.round(c.wind_speed_10m);document.getElementById('rainp').textContent=(c.precipitation||0).toFixed(1)+' mm';document.getElementById('atmo').textContent=desc(c.weather_code);drawHours(0);drawPoints();updateEffects(c.weather_code)}
function drawHours(offset){const x=data[selected];if(!x)return;const now=new Date();let idx=x.hourly.time.findIndex(t=>new Date(t)>=now);idx=Math.max(0,idx)+offset;const h=document.getElementById('hours');h.innerHTML='';for(let k=0;k<8;k++){const i=Math.min(idx+k,x.hourly.time.length-1),t=new Date(x.hourly.time[i]);h.innerHTML+=`<div class="hour"><div class="time">${t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div class="t">${Math.round(x.hourly.temperature_2m[i])}°</div><div class="rain">${x.hourly.precipitation_probability[i]||0}% Regen</div></div>`}}
function drawPoints(){const g=document.getElementById('points');g.innerHTML='';places.forEach((p,i)=>{const [x,y]=coords(p),active=i===selected;g.innerHTML+=`<g class="station ${active?'active':''}" transform="translate(${x},${y})" onclick="selectPlace(${i})" style="cursor:pointer"><circle class="halo" r="${active?19:10}" filter="url(#blur)"/><circle class="pin" r="${active?4.5:2.8}"/><text x="9" y="3">${p[0]}</text></g>`})}
function updateEffects(code){const rain=[51,53,55,61,63,65,80,81,82,71,73,75].includes(code);document.getElementById('rainlayer').style.opacity=rain?'1':'0';document.getElementById('storm').style.opacity=[95,96,99].includes(code)?'1':'0'}
function selectPlace(i){selected=i;render()}
document.getElementById('slider').addEventListener('input',e=>drawHours(+e.target.value));
const cards=document.getElementById('cards');places.forEach((p,i)=>{cards.innerHTML+=`<article class="card" id="card${i}" onclick="selectPlace(${i})"><h3>${p[0]}</h3><div class="ct" id="ct${i}">—°</div><div class="cc" id="cc${i}">lädt…</div><div class="mini" id="cm${i}">—</div></article>`});
const oldRender=render;render=function(){oldRender();places.forEach((p,i)=>{const x=data[i];const el=document.getElementById('card'+i);if(x){el.classList.toggle('active',i===selected);document.getElementById('ct'+i).textContent=Math.round(x.current.temperature_2m)+'°';document.getElementById('cc'+i).textContent=desc(x.current.weather_code);document.getElementById('cm'+i).textContent='Wind '+Math.round(x.current.wind_speed_10m)+' km/h'}})};
load();setInterval(load,300000);
</script></body></html>
