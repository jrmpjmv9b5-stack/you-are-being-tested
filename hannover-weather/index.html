<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HANNOVER — WEATHER / LIVE</title>
<style>
:root{--bg:#050806;--paper:#eee9dc;--dim:#8c948e;--gold:#d5b77b;--glass:rgba(13,20,17,.66);--line:rgba(238,233,220,.13)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% 0,#15251e 0,#080d0b 42%,#040605 100%);color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100dvh;overflow-x:hidden}.grain{position:fixed;inset:0;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}.app{width:min(1500px,100%);margin:auto;padding:22px clamp(16px,4vw,58px) 48px}header{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:9px;letter-spacing:4px;color:var(--gold);margin-bottom:8px}.logo{font:clamp(30px,5vw,66px)/.82 Georgia,serif;letter-spacing:-3px}.live{font-size:8px;letter-spacing:2px;color:var(--dim);text-align:right}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d7bb83;box-shadow:0 0 18px #d7bb83;margin-right:7px;animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:18px;margin-top:22px}.map{height:min(72vh,690px);min-height:500px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at 47% 45%,#214438 0,#10241d 28%,#09120f 64%,#050806 100%);box-shadow:0 30px 100px #0008}.map:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 35%,#020504aa 100%);pointer-events:none}.map svg{position:absolute;inset:0;width:100%;height:100%}.maptop,.mapbottom{position:absolute;z-index:3;left:20px;right:20px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:2px;color:var(--dim)}.maptop{top:18px}.mapbottom{bottom:17px}.weather{display:flex;flex-direction:column;justify-content:center;padding:20px 8px}.place{font-size:9px;letter-spacing:5px;color:var(--gold)}.temp{font:clamp(105px,13vw,185px)/.78 Georgia,serif;letter-spacing:-11px;margin:18px 0 12px}.condition{font:clamp(18px,2vw,25px) Georgia,serif}.sub{font-size:9px;color:var(--dim);margin-top:7px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:38px}.metric{padding:17px 7px}.metric b{font:21px Georgia,serif}.metric span{display:block;color:var(--dim);font-size:7px;letter-spacing:1.5px;text-transform:uppercase;margin-top:5px}.forecast{margin-top:24px}.fhead{display:flex;justify-content:space-between;color:var(--dim);font-size:8px;letter-spacing:2px;text-transform:uppercase}.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}.hour{padding:11px 5px;border:1px solid var(--line);border-radius:12px;text-align:center;background:#ffffff03}.hour strong{font:15px Georgia,serif}.hour small{display:block;font-size:7px;color:var(--dim);margin-top:6px}.slider{width:100%;margin:13px 0;accent-color:var(--gold)}.places{margin-top:18px}.sect{font-size:8px;letter-spacing:3px;color:var(--dim);margin:0 0 10px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#101a16cc,#07100cbb);border-radius:15px;padding:14px;cursor:pointer;transition:.25s;backdrop-filter:blur(12px)}.card:hover,.card.active{transform:translateY(-3px);border-color:#aa8d59;box-shadow:0 15px 35px #0005}.card h3{font:17px Georgia,serif;margin:0 0 8px}.card b{font:25px Georgia,serif}.card p{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:6px 0 0}.atmo{margin-top:18px;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;gap:15px;color:var(--dim);font-size:8px;letter-spacing:2px}.bar{height:3px;flex:1;background:#17231e;overflow:hidden;border-radius:5px}.bar i{display:block;height:100%;width:32%;background:var(--gold);animation:scan 3s linear infinite}@keyframes scan{from{transform:translateX(-130%)}to{transform:translateX(400%)}}.wind{position:absolute;inset:0;z-index:2;pointer-events:none}.wind i{position:absolute;width:90px;height:1px;background:#e9e1ce;opacity:.1;animation:flow linear infinite}@keyframes flow{to{transform:translateX(900px)}}.rain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0}.rain i{position:absolute;width:1px;height:35px;background:#c7d7d0;animation:drop linear infinite}@keyframes drop{to{transform:translateY(720px)}}.error{color:#d7a889;font-size:10px;margin-top:12px}@media(max-width:980px){.hero{grid-template-columns:1fr}.map{height:55vh;min-height:410px}.weather{padding:18px 3px}.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.app{padding:17px 13px 35px}.logo{letter-spacing:-2px}.hero{margin-top:18px}.map{height:54vh;min-height:390px;border-radius:23px}.temp{font-size:112px;margin:17px 0 12px}.metrics{margin-top:30px}.hours{grid-template-columns:repeat(3,1fr)}.hour:nth-child(n+4){display:none}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:12px}.card h3{font-size:15px}}
</style></head>
<body><div class="grain"></div><main class="app">
<header><div><div class="eyebrow">REGION HANNOVER / LIVE ATMOSPHERE</div><div class="logo">HANNOVER<br>WEATHER</div></div><div class="live"><span class="dot"></span><span id="updated">CONNECTING</span></div></header>
<section class="hero"><div class="map"><div class="maptop"><span>REGIONAL FIELD</span><span>20 STATIONS</span></div><div class="wind" id="wind"></div><div class="rain" id="rain"></div><svg viewBox="0 0 700 650"><defs><filter id="g"><feGaussianBlur stdDeviation="9"/></filter><radialGradient id="rg"><stop stop-color="#e8d29b" stop-opacity=".35"/><stop offset="1" stop-color="#e8d29b" stop-opacity="0"/></radialGradient></defs><path d="M125 120Q280 45 455 95Q595 135 590 275Q625 410 500 525Q360 615 205 535Q75 470 95 315Q65 195 125 120Z" fill="#0a1813" stroke="#3a5a4c" stroke-width="2"/><path d="M95 320Q210 270 335 295T605 260M175 120Q225 230 205 535M455 95Q405 240 500 525M100 430Q280 390 580 420M140 210Q330 180 545 205" fill="none" stroke="#244238" stroke-width="1"/><path d="M105 365Q260 300 400 335T590 300" fill="none" stroke="#d1b579" stroke-width="1" stroke-dasharray="2 9" opacity=".5"/><circle cx="350" cy="315" r="115" fill="url(#rg)" opacity=".35"/><g id="points"></g></svg><div class="mapbottom"><span>OPEN-METEO / DWD MODELS</span><span>AUTO REFRESH 5 MIN</span></div></div>
<div class="weather"><div class="place" id="place">HANNOVER</div><div class="temp" id="temp">—°</div><div class="condition" id="condition">Wetter wird geladen</div><div class="sub" id="sub">Regionale Live-Messung</div><div class="metrics"><div class="metric"><b id="feels">—°</b><span>gefühlte temp.</span></div><div class="metric"><b id="windv">—</b><span>wind km/h</span></div><div class="metric"><b id="rainp">—</b><span>niederschlag</span></div></div><div class="forecast"><div class="fhead"><span>Next hours</span><span id="day">LIVE</span></div><input class="slider" id="slider" type="range" min="0" max="7" value="0"><div class="hours" id="hours"></div></div></div></section>
<section class="places"><div class="sect">REGION / LIVE LOCATIONS</div><div class="cards" id="cards"></div></section><div class="atmo"><span>ATMOSPHERE</span><div class="bar"><i></i></div><span id="atmo">LIVE FIELD</span></div><div id="error" class="error"></div>
</main><script>
const places=[['Hannover',52.3759,9.732],['Langenhagen',52.447,9.743],['Garbsen',52.426,9.6],['Wunstorf',52.423,9.427],['Neustadt',52.505,9.462],['Burgwedel',52.5,9.863],['Lehrte',52.375,9.98],['Burgdorf',52.447,10.006],['Laatzen',52.315,9.797],['Barsinghausen',52.3,9.46],['Springe',52.208,9.552],['Seelze',52.397,9.598],['Wedemark',52.545,9.733],['Isernhagen',52.48,9.84],['Ronnenberg',52.319,9.655],['Hemmingen',52.322,9.742],['Pattensen',52.265,9.768],['Gehrden',52.313,9.6],['Wennigsen',52.275,9.57],['Uetze',52.465,10.205]];
let data={},selected=0;const desc={0:'klar',1:'überwiegend klar',2:'leicht bewölkt',3:'bedeckt',45:'Nebel',48:'Nebel',51:'Nieselregen',53:'Nieselregen',55:'Nieselregen',61:'leichter Regen',63:'Regen',65:'starker Regen',71:'Schnee',73:'Schnee',75:'starker Schnee',80:'Schauer',81:'Schauer',82:'starke Schauer',95:'Gewitter',96:'Gewitter',99:'Gewitter'};
function weather(c){return desc[c]||'wechselhaft'}
async function load(){try{const u='https://api.open-meteo.com/v1/forecast?latitude='+places.map(p=>p[1]).join(',')+'&longitude='+places.map(p=>p[2]).join(',')+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=1&timezone=Europe%2FBerlin';const r=await fetch(u);if(!r.ok)throw Error();const a=await r.json();(Array.isArray(a)?a:[a]).forEach((x,i)=>data[i]=x);render();document.getElementById('updated').textContent='LIVE · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent='Live-Daten nicht erreichbar — Internetverbindung prüfen.'}}
function render(){const x=data[selected];if(!x)return;const c=x.current;place.textContent=places[selected][0].toUpperCase();temp.textContent=Math.round(c.temperature_2m)+'°';condition.textContent=weather(c.weather_code);feels.textContent=Math.round(c.apparent_temperature)+'°';windv.textContent=Math.round(c.wind_speed_10m);rainp.textContent=(c.precipitation||0).toFixed(1)+' mm';atmo.textContent=weather(c.weather_code).toUpperCase();drawHours(+slider.value);drawPoints();document.querySelectorAll('.card').forEach((e,i)=>e.classList.toggle('active',i===selected));document.getElementById('rain').style.opacity=[61,63,65,80,81,82,95,96,99].includes(c.weather_code)?.24:0}
function drawHours(off){const x=data[selected];if(!x)return;let n=x.hourly.time.findIndex(t=>new Date(t)>=new Date());n=Math.max(0,n)+off;hours.innerHTML='';for(let k=0;k<6;k++){let i=Math.min(n+k,x.hourly.time.length-1),t=new Date(x.hourly.time[i]);hours.innerHTML+=`<div class="hour"><strong>${Math.round(x.hourly.temperature_2m[i])}°</strong><small>${t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</small><small>${x.hourly.precipitation_probability[i]||0}% rain</small></div>`}}
function selectPlace(i){selected=i;render()}function drawPoints(){points.innerHTML='';places.forEach((p,i)=>{let x=90+(p[2]-9.42)*2500,y=500-(p[1]-52.2)*2500;x=Math.max(105,Math.min(595,x));y=Math.max(90,Math.min(545,y));let a=i===selected;points.innerHTML+=`<g transform="translate(${x},${y})" onclick="selectPlace(${i})" style="cursor:pointer"><circle r="${a?20:9}" fill="#d5b77b" opacity="${a?.12:.04}" filter="url(#g)"/><circle r="${a?5:2.5}" fill="${a?'#eee9dc':'#87938e'}"/><text x="9" y="3" fill="${a?'#eee9dc':'#74827b'}" font-size="${a?10:7}">${p[0]}</text></g>`})}
places.forEach((p,i)=>cards.innerHTML+=`<article class="card" onclick="selectPlace(${i})"><h3>${p[0]}</h3><b id="ct${i}">—°</b><p id="cc${i}">lädt...</p></article>`);for(let i=0;i<18;i++){let e=document.createElement('i');e.style.top=Math.random()*100+'%';e.style.left=Math.random()*100+'%';e.style.animationDuration=5+Math.random()*8+'s';e.style.animationDelay=-Math.random()*10+'s';wind.appendChild(e)}for(let i=0;i<32;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=-10+Math.random()*100+'%';e.style.animationDuration=.5+Math.random()*.8+'s';e.style.animationDelay=-Math.random()*2+'s';rain.appendChild(e)}const base=render;render=function(){base();places.forEach((p,i)=>{if(data[i]){document.getElementById('ct'+i).textContent=Math.round(data[i].current.temperature_2m)+'°';document.getElementById('cc'+i).textContent=weather(data[i].current.weather_code)}})};slider.addEventListener('input',e=>drawHours(+e.target.value));load();setInterval(load,300000);
</script></body></html>
