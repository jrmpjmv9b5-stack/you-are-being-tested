<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>EARTH LIVE — V7</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#02040b;color:#eef6ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:.3em;font-size:13px}.sub{font-size:8px;color:#78879d;letter-spacing:.16em;margin-top:6px}.live{font-size:9px;color:#8de8c0;letter-spacing:.18em}.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8de8c0;box-shadow:0 0 15px #8de8c0;margin-right:7px}.panel{position:absolute;top:84px;left:18px;padding:10px 13px;border:1px solid #bcd7ff33;border-radius:14px;background:#030811bd;backdrop-filter:blur(14px);font-size:8px;line-height:1.8;letter-spacing:.12em;color:#aebbd0}.panel b{color:#fff}.mode{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:8px;color:#9eb0c8;letter-spacing:.16em;padding:5px 8px;border:1px solid #bcd7ff20;border-radius:9px;background:#03081180}.bottom{position:absolute;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.hint{font-size:8px;line-height:1.6;color:#738198;letter-spacing:.12em}.data{text-align:right}.data strong{font-size:11px;letter-spacing:.08em}.data small{display:block;color:#68768c;font-size:8px;margin-top:4px}.controls{position:absolute;right:18px;bottom:max(64px,calc(env(safe-area-inset-bottom) + 54px));display:flex;gap:8px;pointer-events:auto}.btn{width:43px;height:43px;border-radius:50%;border:1px solid #bcd7ff33;background:#030811bd;color:#eef6ff;font-size:17px;display:grid;place-items:center}.info{position:fixed;z-index:5;left:50%;bottom:max(105px,calc(env(safe-area-inset-bottom) + 95px));transform:translate(-50%,18px);width:min(90vw,390px);padding:15px;border:1px solid #bcd7ff38;border-radius:17px;background:#02070fe8;backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:.2s;font-size:10px;line-height:1.6}.info.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.close{float:right;font-size:17px}.attr{position:absolute;right:8px;bottom:4px;font-size:7px;color:#b8c3d088}.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 45%,#0b1c36,#010207 72%);transition:opacity .5s}.introTitle{font-size:25px;font-weight:800;letter-spacing:.34em}.introSub{margin-top:12px;color:#7d8ba1;font-size:9px;letter-spacing:.2em}.enter{margin-top:34px;padding:15px 25px;border-radius:999px;border:1px solid #bedcff45;background:#0f1f36b8;color:#eef6ff;letter-spacing:.2em;font-size:10px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","topojson":"https://cdn.jsdelivr.net/npm/topojson-client@3/+esm"}}</script></head><body><canvas id="c"></canvas><div id="intro" class="intro"><div><div class="introTitle">EARTH LIVE</div><div class="introSub">A LIVING PLANETARY OBSERVATORY</div><button class="enter" id="enter">ENTER EARTH LIVE</button><div style="margin-top:12px;color:#78879d;font-size:8px;letter-spacing:.14em">ARTISTIC EARTH · LIVE PLANET DATA</div></div></div><div class="ui"><div class="top"><div><div class="brand">EARTH LIVE</div><div class="sub">LIVING PLANET MAP</div></div><div class="live"><i></i>LIVE</div></div><div class="panel"><div>EARTHQUAKES <b id="eq">—</b></div><div>STORM CELLS <b id="st">—</b></div><div>UTC <b id="utc">--:--:--</b></div></div><div class="mode" id="mode">PLANET VIEW</div><div class="bottom"><div class="hint">DRAG · ROTATE EARTH<br>PINCH / WHEEL · ZOOM<br>TAP · EXPLORE</div><div class="data"><strong id="coord">0.0° N · 0.0° E</strong><small id="detail">PLANET VIEW</small></div></div><div class="controls"><button class="btn" id="sound">♪</button><button class="btn" id="reset">↺</button></div></div><div id="info" class="info"></div><div class="attr">Natural Earth boundaries · live overlays</div><script type="module">import*as THREE from'three';import{feature}from'topojson';const $=s=>document.querySelector(s),canvas=$('#c');const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(innerWidth,innerHeight,false);R.outputColorSpace=THREE.SRGBColorSpace;const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.01,100);C.position.z=3.35;const G=new THREE.Group();S.add(G);let zoom=.52,target=.52;const L=new THREE.TextureLoader(),base='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';const day=L.load(base+'earth_atmos_2048.jpg');day.colorSpace=THREE.SRGBColorSpace;const night=L.load(base+'earth_lights_2048.png');night.colorSpace=THREE.SRGBColorSpace;const cloudsT=L.load(base+'earth_clouds_2048.png');cloudsT.colorSpace=THREE.SRGBColorSpace;const sun=new THREE.Vector3();const M=new THREE.ShaderMaterial({uniforms:{dayTex:{value:day},nightTex:{value:night},sunDir:{value:sun}},vertexShader:'varying vec2 u;varying vec3 n;void main(){u=uv;n=normalize((modelMatrix*vec4(normal,0.)).xyz);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform sampler2D dayTex,nightTex;uniform vec3 sunDir;varying vec2 u;varying vec3 n;void main(){float d=dot(n,normalize(sunDir));float l=smoothstep(-.10,.16,d);vec3 a=texture2D(dayTex,u).rgb;vec3 q=texture2D(nightTex,u).rgb;a=pow(a,vec3(.82));a=floor(a*5.0)/5.0;a=mix(a,vec3(.22,.55,.32),.18);q*=2.1;vec3 c=mix(q,a,l);float tw=smoothstep(-.24,.10,d)*(1.-smoothstep(.10,.26,d));c+=vec3(.10,.24,.46)*tw*.65;float rim=pow(1.-max(0.,dot(n,normalize(cameraPosition))),3.);c+=vec3(.03,.17,.48)*rim;gl_FragColor=vec4(c,1.);}'});const earth=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),M);G.add(earth);const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.018,96,96),new THREE.MeshPhongMaterial({map:cloudsT,transparent:true,opacity:.48,depthWrite:false}));G.add(clouds);const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.055,96,96),new THREE.MeshBasicMaterial({color:0x3b9cff,transparent:true,opacity:.14,side:THREE.BackSide,blending:THREE.AdditiveBlending}));G.add(atmo);const stars=[];for(let i=0;i<5000;i++){let t=Math.random()*6.283,p=Math.acos(2*Math.random()-1);stars.push(20*Math.sin(p)*Math.cos(t),20*Math.cos(p),20*Math.sin(p)*Math.sin(t))}let SG=new THREE.BufferGeometry();SG.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));S.add(new THREE.Points(SG,new THREE.PointsMaterial({color:0xd5e4f4,size:.018,transparent:true,opacity:.72})));const borders=new THREE.Group();G.add(borders);function P(lat,lon,r=1.012){let a=lat*Math.PI/180,b=lon*Math.PI/180;return new THREE.Vector3(Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)).multiplyScalar(r)}function drawCoords(coords){for(const seg of coords){if(seg.length<2)continue;let pts=seg.map(p=>P(p[1],p[0]));let geo=new THREE.BufferGeometry().setFromPoints(pts);borders.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xd4e5d2,transparent:true,opacity:.7})))}}async function bordersLoad(){try{let t=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(x=>x.json());let f=feature(t,t.objects.countries);f.features.forEach(x=>{let g=x.geometry;if(g.type==='Polygon')drawCoords(g.coordinates);else if(g.type==='MultiPolygon')g.coordinates.forEach(p=>drawCoords(p))})}catch(e){}}const eqG=new THREE.Group(),stormG=new THREE.Group();G.add(eqG,stormG);const hits=[];function marker(lat,lon,color,size,data,group){let o=new THREE.Group();o.position.copy(P(lat,lon,1.035));o.add(new THREE.Mesh(new THREE.SphereGeometry(size,12,12),new THREE.MeshBasicMaterial({color})));o.userData=data;group.add(o);hits.push(o)}async function live(){try{let q=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson').then(x=>x.json());while(eqG.children.length){let x=eqG.children.pop();x.traverse(o=>{o.geometry?.dispose();o.material?.dispose()})}hits.splice(0,hits.length);q.features.forEach(f=>{let[lon,lat,dep]=f.geometry.coordinates,m=f.properties.mag||1;marker(lat,lon,0xffad58,Math.min(.032,.006+m*.004),{kind:'quake',lat,lon,dep,m,place:f.properties.place,time:f.properties.time},eqG)});$('#eq').textContent=q.features.length;$('#st').textContent='—'}catch(e){}}function solar(){let d=new Date(),N=Math.floor((d-Date.UTC(d.getUTCFullYear(),0,0))/86400000),dec=23.44*Math.sin(2*Math.PI*(N-81)/365)*Math.PI/180,h=d.getUTCHours()+d.getUTCMinutes()/60,dlong=(12-h)*15*Math.PI/180;sun.set(Math.cos(dec)*Math.sin(dlong),Math.sin(dec),Math.cos(dec)*Math.cos(dlong)).normalize();M.uniforms.sunDir.value.copy(sun)}let ac,mg;function sound(){if(ac)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A;mg=ac.createGain();mg.gain.value=.022;mg.connect(ac.destination);let o=ac.createOscillator(),f=ac.createBiquadFilter();o.frequency.value=48;f.frequency.value=150;o.connect(f).connect(mg);o.start()}$('#enter').onclick=()=>{sound();$('#intro').style.opacity=0;setTimeout(()=>$('#intro').remove(),500)};$('#sound').onclick=()=>{if(!ac)sound();else mg.gain.value=mg.gain.value>.001?0:.022};$('#reset').onclick=()=>{G.quaternion.identity();target=.52};let active=null,lastX=0,lastY=0,moved=false,pinch=0;function down(e){if(e.target.closest?.('.btn'))return;active=e.pointerId;lastX=e.clientX;lastY=e.clientY;moved=false;canvas.setPointerCapture(e.pointerId)}function move(e){if(e.pointerId!==active)return;let dx=(e.clientX-lastX)/innerWidth,dy=(e.clientY-lastY)/innerHeight;if(Math.hypot(dx,dy)<.001)return;moved=true;let ax=new THREE.Vector3(1,0,0).applyQuaternion(G.quaternion);G.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(ax,-dy*3.5));G.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-dx*3.5));lastX=e.clientX;lastY=e.clientY}function up(e){if(e.pointerId!==active)return;if(!moved)pick(e);active=null}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('wheel',e=>{e.preventDefault();target=THREE.MathUtils.clamp(target*Math.exp(-e.deltaY*.0018),.52,60)},{passive:false});canvas.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)target=THREE.MathUtils.clamp(target*d/pinch,.52,60);pinch=d}},{passive:false});canvas.addEventListener('touchend',e=>{e.preventDefault();pinch=0},{passive:false});function pick(e){let v=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),ray=new THREE.Raycaster();ray.setFromCamera(v,C);let h=ray.intersectObjects(hits,true)[0];if(h){let d=h.object.parent.userData||h.object.userData;$('#info').innerHTML='<span class="close" onclick="document.querySelector(\'#info\').classList.remove(\'show\')">×</span><b>EARTHQUAKE</b><div style="font-size:15px;margin-top:5px">M '+Number(d.m).toFixed(1)+'</div><div style="margin-top:7px;color:#9eacc0">'+d.place+'<br>'+d.dep+' km depth<br>'+d.lat.toFixed(2)+'°, '+d.lon.toFixed(2)+'°</div>';$('#info').classList.add('show');return}let h2=ray.intersectObject(earth)[0];if(h2){let p=h2.point.clone().applyQuaternion(G.quaternion.clone().invert()).normalize(),lat=Math.asin(p.y)*180/Math.PI,lon=Math.atan2(p.x,p.z)*180/Math.PI;$('#coord').textContent=Math.abs(lat).toFixed(1)+'° '+(lat>=0?'N':'S')+' · '+Math.abs(lon).toFixed(1)+'° '+(lon>=0?'E':'W')}}function animate(){requestAnimationFrame(animate);zoom+=(target-zoom)*.13;G.scale.setScalar(zoom);clouds.rotation.y+=.00028;solar();let m=zoom<1?'PLANET VIEW':zoom<4?'CONTINENT VIEW':zoom<12?'COUNTRY VIEW':'REGION VIEW';$('#mode').textContent=m;$('#detail').textContent=m;$('#utc').textContent=new Date().toISOString().slice(11,19);R.render(S,C)}animate();bordersLoad();live();setInterval(live,60000);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight,false)});</script></body></html>
