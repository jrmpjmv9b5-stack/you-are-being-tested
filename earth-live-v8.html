/b></div><div>UTC <b id="utc">--:--:--</b></div></div><div class="mode" id="mode">PLANET</div><div class="bottom"><div class="hint">DRAG · MOVE THE GLOBE<br>PINCH / WHEEL · DEEP ZOOM<br>TAP · INSPECT LAYERS</div><div class="data"><strong id="coord">0.0° N · 0.0° E</strong><small id="detail">PLANET SCALE</small></div></div><div class="controls"><button class="btn" id="sound">♪</button><button class="btn" id="reset">↺</button></div></div><div id="info" class="info"></div><div class="attr">Natural Earth boundaries · live overlays</div><script type="module">import*as THREE from'three';const $=s=>document.querySelector(s),c=$('#c'),R=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(innerWidth,innerHeight,false);R.outputColorSpace=THREE.SRGBColorSpace;const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);C.position.z=3.25;const G=new THREE.Group();S.add(G);let zoom=.56,target=.56,vel=new THREE.Vector2(),drag=null,lastPinch=0;const T=new THREE.TextureLoader(),base='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';const raw=T.load(base+'earth_atmos_2048.jpg');raw.colorSpace=THREE.SRGBColorSpace;const night=T.load(base+'earth_lights_2048.png');night.colorSpace=THREE.SRGBColorSpace;const cloudsT=T.load(base+'earth_clouds_2048.png');cloudsT.colorSpace=THREE.SRGBColorSpace;const sun=new THREE.Vector3();const M=new THREE.ShaderMaterial({uniforms:{tex:{value:raw},night:{value:night},sun:{value:sun},time:{value:0}},vertexShader:'varying vec2 u;varying vec3 n;void main(){u=uv;n=normalize((modelMatrix*vec4(normal,0.)).xyz);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform sampler2D tex,night;uniform vec3 sun;uniform float time;varying vec2 u;varying vec3 n;void main(){float d=dot(n,normalize(sun));float day=smoothstep(-.10,.14,d);vec3 q=texture2D(tex,u).rgb;float land=smoothstep(.015,.12,q.r-q.b*.55)+smoothstep(.08,.25,q.g-q.b*.72);land=clamp(land,0.,1.);vec3 ocean=vec3(.035,.25,.48);vec3 l1=vec3(.48,.68,.34),l2=vec3(.82,.64,.28),l3=vec3(.94,.78,.40);float lum=dot(q,vec3(.299,.587,.114));vec3 landc=lum<.30?l1:lum<.52?l2:l3;landc=mix(landc,vec3(.96,.90,.67),smoothstep(.62,.9,lum)*.55);vec3 styl=mix(ocean,landc,clamp(land*.72+.15,0.,1.));styl=floor(styl*5.0+.5)/5.0;vec3 nite=texture2D(night,u).rgb;nite=floor(nite*4.0+.5)/4.0;vec3 col=mix(nite*1.8,styl*(.72+1.05*max(d,0.)),day);float tw=smoothstep(-.22,.08,d)*(1.-smoothstep(.08,.28,d));col+=vec3(.08,.22,.46)*tw;float rim=pow(1.-max(0.,dot(n,normalize(cameraPosition))),3.);col+=vec3(.05,.22,.65)*rim;gl_FragColor=vec4(col,1.);}'});const E=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),M);G.add(E);const CL=new THREE.Mesh(new THREE.SphereGeometry(1.016,96,96),new THREE.MeshBasicMaterial({map:cloudsT,transparent:true,opacity:.38,depthWrite:false}));G.add(CL);const A=new THREE.Mesh(new THREE.SphereGeometry(1.045,96,96),new THREE.MeshBasicMaterial({color:0x4aa4ff,transparent:true,opacity:.14,side:THREE.BackSide,blending:THREE.AdditiveBlending}));G.add(A);const glow=new THREE.Mesh(new THREE.SphereGeometry(1.075,64,64),new THREE.MeshBasicMaterial({color:0x174b9b,transparent:true,opacity:.055,side:THREE.BackSide,blending:THREE.AdditiveBlending}));G.add(glow);const borderG=new THREE.Group(),gridG=new THREE.Group(),dataG=new THREE.Group();G.add(borderG,gridG,dataG);function P(lat,lon,r=1.012){let a=lat*Math.PI/180,b=lon*Math.PI/180;return new THREE.Vector3(Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)).multiplyScalar(r)}function line(points,mat,group=borderG){let g=new THREE.BufferGeometry().setFromPoints(points);group.add(new THREE.Line(g,mat))}const coastMat=new THREE.LineBasicMaterial({color:0xd9e6ee,transparent:true,opacity:.8}),countryMat=new THREE.LineBasicMaterial({color:0x263b4d,transparent:true,opacity:.95});function addGeo(f){let ge=f.geometry;if(!ge)return;let arr=ge.type==='Polygon'?[ge.coordinates]:ge.coordinates;arr.forEach(poly=>{poly.forEach(ring=>{if(ring.length>1)line(ring.map(p=>P(p[1],p[0],1.014)),countryMat)})})}async function borders(){try{let j=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/main/data/countries.geojson').then(r=>r.json());j.features.forEach(addGeo)}catch(e){}}borders();const grMat=new THREE.LineBasicMaterial({color:0x76a6c6,transparent:true,opacity:.08});for(let lat=-60;lat<=60;lat+=30){let a=[];for(let lon=-180;lon<=180;lon+=4)a.push(P(lat,lon,1.009));line(a,grMat,gridG)}for(let lon=-180;lon<180;lon+=30){let a=[];for(let lat=-88;lat<=88;lat+=4)a.push(P(lat,lon,1.009));line(a,grMat,gridG)}function stars(){let a=[];for(let i=0;i<6000;i++){let t=Math.random()*6.283,p=Math.acos(2*Math.random()-1);a.push(20*Math.sin(p)*Math.cos(t),20*Math.cos(p),20*Math.sin(p)*Math.sin(t))}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));S.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xd9e7f7,size:.016,transparent:true,opacity:.7})))}stars();const hits=[];function clear(g){while(g.children.length){let x=g.children.pop();x.traverse(o=>{o.geometry?.dispose();o.material?.dispose()})}}function marker(lat,lon,color,size,u){let o=new THREE.Group();o.position.copy(P(lat,lon,1.035));let m=new THREE.Mesh(new THREE.SphereGeometry(size,12,12),new THREE.MeshBasicMaterial({color}));o.add(m);o.userData=u;dataG.add(o);hits.push(o)}async function data(){try{let q=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson').then(r=>r.json());clear(dataG);hits.length=0;q.features.forEach(f=>{let[lon,lat,dep]=f.geometry.coordinates,m=f.properties.mag||1;marker(lat,lon,0xff8d43,Math.max(.007,Math.min(.028,.006+m*.004)),{kind:'quake',lat,lon,dep,m,place:f.properties.place})});$('#eq').textContent=q.features.length;let arr=[];for(let lat=-60;lat<=60;lat+=20)for(let lon=-180;lon<180;lon+=30)arr.push([lat,lon]);let u='https://api.open-meteo.com/v1/forecast?latitude='+arr.map(x=>x[0]).join(',')+'&longitude='+arr.map(x=>x[1]).join(',')+'&current=weather_code,temperature_2m,wind_speed_10m&timezone=UTC';let w=await fetch(u).then(r=>r.json()),n=0;(Array.isArray(w)?w:[w]).forEach((x,i)=>{if(x.current?.weather_code>=95){marker(arr[i][0],arr[i][1],0x4fe1ff,.018,{kind:'storm',lat:arr[i][0],lon:arr[i][1],temp:x.current.temperature_2m,wind:x.current.wind_speed_10m});n++}});$('#st').textContent=n}catch(e){}}function solar(){let d=new Date(),N=Math.floor((d-Date.UTC(d.getUTCFullYear(),0,0))/86400000),dec=23.44*Math.sin(2*Math.PI*(N-81)/365)*Math.PI/180,h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600,lon=(12-h)*15*Math.PI/180;sun.set(Math.cos(dec)*Math.sin(lon),Math.sin(dec),Math.cos(dec)*Math.cos(lon)).normalize();M.uniforms.sun.value.copy(sun)}function qFromScreen(dx,dy){let qx=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-dx*2.9),axis=new THREE.Vector3(1,0,0).applyQuaternion(G.quaternion),qy=new THREE.Quaternion().setFromAxisAngle(axis,-dy*2.9);return qy.multiply(qx)}function down(e){if(e.target.closest?.('.btn'))return;drag={x:e.clientX,y:e.clientY,t:performance.now()};c.setPointerCapture?.(e.pointerId)}function move(e){if(!drag)return;let dx=(e.clientX-drag.x)/innerWidth,dy=(e.clientY-drag.y)/innerHeight;if(Math.hypot(dx,dy)>.001){G.quaternion.premultiply(qFromScreen(dx,dy));vel.set(dx,dy);drag.x=e.clientX;drag.y=e.clientY}}function up(){drag=null}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('wheel',e=>{e.preventDefault();target=THREE.MathUtils.clamp(target*Math.exp(-e.deltaY*.0022),.56,55)},{passive:false});let pinch=0;c.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)target=THREE.MathUtils.clamp(target*d/pinch,.56,55);pinch=d}},{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();pinch=0},{passive:false});function inspect(e){let ray=new THREE.Raycaster(),m=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(m,C);let h=ray.intersectObjects(hits,true)[0];if(h){let d=h.object.parent.userData||h.object.userData;show(d)}}c.addEventListener('click',e=>{if(Math.hypot((e.clientX-(drag?.x||e.clientX)),(e.clientY-(drag?.y||e.clientY)))<4)inspect(e)});function show(d){let s=d.kind==='quake'?'<b>EARTHQUAKE</b><div style="font-size:17px;margin-top:4px">M '+d.m.toFixed(1)+'</div><div class="grid"><span>PLACE</span><b>'+d.place+'</b><span>DEPTH</span><b>'+d.dep+' km</b></div>':'<b>STORM CELL</b><div class="grid"><span>TEMP</span><b>'+d.temp+' °C</b><span>WIND</span><b>'+d.wind+' km/h</b></div>';$('#info').innerHTML='<span class="close" onclick="this.parentElement.classList.remove(\'show\')">×</span>'+s;$('#info').classList.add('show')}let ac,master;function sound(){if(ac)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A;master=ac.createGain();master.gain.value=.025;master.connect(ac.destination);let o=ac.createOscillator();o.frequency.value=47;o.connect(master);o.start()}$('#enter').onclick=()=>{sound();$('#intro').style.opacity=0;setTimeout(()=>$('#intro').remove(),500)};$('#sound').onclick=()=>{if(!ac)sound();else master.gain.value=master.gain.value>.001?0:.025};$('#reset').onclick=()=>{G.quaternion.identity();target=.56;vel.set(0,0)};function animate(){requestAnimationFrame(animate);zoom+=(target-zoom)*.14;G.scale.setScalar(zoom);if(!drag&&vel.lengthSq()>.000001){G.quaternion.premultiply(qFromScreen(vel.x*.35,vel.y*.35));vel.multiplyScalar(.93)}CL.rotation.y+=.00022;M.uniforms.time.value=performance.now()/1000;solar();$('#utc').textContent=new Date().toISOString().slice(11,19);let mode=zoom<1?'PLANET':zoom<3?'CONTINENT':zoom<9?'COUNTRY':zoom<22?'REGION':'DETAIL';$('#mode').textContent=mode;$('#detail').textContent=mode+' · '+zoom.toFixed(1)+'×';R.render(S,C)}animate();data();setInterval(data,60000);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight,false)});</script></body></html>
