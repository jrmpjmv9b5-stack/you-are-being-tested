<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EARTH LIVE — V4</title>
<style>
:root{--fg:#eef6ff;--muted:#8493aa;--line:rgba(190,215,255,.2);--glass:rgba(3,8,17,.72);--accent:#8de8c0;--orange:#ffc36f;--blue:#70d8ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#010207;color:var(--fg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#space,#earth{position:fixed;inset:0;width:100%;height:100%;display:block}#space{background:radial-gradient(circle at 50% 43%,#07172d 0,#020713 40%,#010207 76%)}
.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between}.brand{font-size:13px;font-weight:800;letter-spacing:.3em}.sub{font-size:9px;color:var(--muted);letter-spacing:.2em;margin-top:7px}.live{font-size:9px;letter-spacing:.18em;color:var(--accent);display:flex;gap:7px;align-items:center}.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.panel{position:absolute;left:18px;top:86px;padding:11px 13px;border:1px solid var(--line);background:var(--glass);border-radius:14px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);font-size:8px;letter-spacing:.14em;line-height:1.8;color:#aebbd0}.panel b{color:#fff}.ok{color:var(--accent)}
.bottom{position:absolute;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end}.hint{font-size:8px;line-height:1.55;letter-spacing:.13em;color:#738198}.data{text-align:right}.data strong{font-size:11px;letter-spacing:.1em}.data small{display:block;color:#68768c;font-size:8px;letter-spacing:.1em;margin-top:5px}
.controls{position:absolute;right:18px;bottom:max(64px,calc(env(safe-area-inset-bottom) + 54px));display:flex;gap:8px;pointer-events:auto}.btn{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#eaf3ff;font-size:17px;display:grid;place-items:center;backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);box-shadow:0 10px 30px #0008}.btn:active{transform:scale(.94)}
#info{position:fixed;z-index:8;left:50%;bottom:max(108px,calc(env(safe-area-inset-bottom) + 98px));transform:translateX(-50%);width:min(88vw,380px);padding:15px 16px;border:1px solid rgba(190,215,255,.24);border-radius:17px;background:rgba(2,7,15,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:.22s;font-size:10px;line-height:1.65;letter-spacing:.04em;box-shadow:0 20px 60px #0009}.infoHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.infoType{font-size:8px;letter-spacing:.18em;color:var(--orange)}.infoTitle{font-size:14px;font-weight:700}.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;color:#a9b7cc}.infoGrid b{color:#f4f8ff}.infoLink{display:inline-block;margin-top:9px;color:#8ddcff;text-decoration:none;pointer-events:auto}.close{pointer-events:auto;cursor:pointer;color:#94a4ba;font-size:16px}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,#091a32,#010207 68%);text-align:center;transition:opacity .65s}.introTitle{font-size:25px;font-weight:800;letter-spacing:.34em}.introSub{margin-top:12px;color:#7d8ba1;font-size:9px;letter-spacing:.2em}.enter{margin-top:35px;padding:15px 25px;border-radius:999px;border:1px solid rgba(190,220,255,.28);background:rgba(15,31,54,.72);color:#eef6ff;letter-spacing:.2em;font-size:10px}.source{margin-top:22px;color:#4e5c70;font-size:8px;line-height:1.8;letter-spacing:.08em}
@media(max-width:600px){.top{left:16px;right:16px}.panel{left:16px;top:86px}.bottom{left:16px;right:16px}.controls{right:16px}.hint{max-width:155px}.data strong{font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div id="space"></div><canvas id="earth"></canvas>
<div id="intro"><div><div class="introTitle">EARTH LIVE</div><div class="introSub">A LIVING PLANETARY OBSERVATORY</div><button class="enter" id="enter">ENTER EARTH LIVE</button><div class="source">REAL EARTH · LIVE EARTHQUAKES · LIVE WEATHER · AMBIENT AUDIO</div></div></div>
<div class="ui">
<div class="top"><div><div class="brand">EARTH LIVE</div><div class="sub">PLANETARY OBSERVATION</div></div><div class="live"><i></i>LIVE</div></div>
<div class="panel"><div>EARTHQUAKES <b id="eqCount">—</b></div><div>STORM CELLS <b id="stormCount">—</b></div><div>DATA <span class="ok" id="dataStatus">CONNECTING</span></div><div>UTC <b id="clock">--:--:--</b></div></div>
<div class="bottom"><div class="hint">DRAG · ROTATE<br>PINCH · DEEP ZOOM<br>TAP A MARKER · DETAILS</div><div class="data"><strong id="coords">0.0° N · 0.0° E</strong><small id="updated">LIVE DATA · —</small></div></div>
<div class="controls"><button class="btn" id="sound">♪</button><button class="btn" id="reset">↺</button></div></div>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#earth');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.z=3.45;
const earthGroup=new THREE.Group();scene.add(earthGroup);let zoom=1.0;earthGroup.scale.setScalar(zoom);
const loader=new THREE.TextureLoader();const base='https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/';
const day=loader.load(base+'earth_atmos_2048.jpg');day.colorSpace=THREE.SRGBColorSpace;const night=loader.load(base+'earth_lights_2048.png');night.colorSpace=THREE.SRGBColorSpace;const cloudsTex=loader.load(base+'earth_clouds_2048.png');cloudsTex.colorSpace=THREE.SRGBColorSpace;
const earthMat=new THREE.ShaderMaterial({uniforms:{dayTex:{value:day},nightTex:{value:night},sunDir:{value:new THREE.Vector3(1,0,1).normalize()},time:{value:0}},vertexShader:`varying vec2 vUv;varying vec3 vWorld;void main(){vUv=uv;vWorld=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform sampler2D dayTex;uniform sampler2D nightTex;uniform vec3 sunDir;uniform float time;varying vec2 vUv;varying vec3 vWorld;void main(){vec3 n=normalize(vWorld);float d=dot(n,normalize(sunDir));float dayMask=smoothstep(-0.08,0.12,d);float twilight=smoothstep(-0.34,0.06,d)-smoothstep(0.06,0.20,d);vec3 daytime=texture2D(dayTex,vUv).rgb;vec3 night=texture2D(nightTex,vUv).rgb;daytime*=0.48+1.12*max(d,0.0);night*=1.75;vec3 c=mix(night,daytime,dayMask);c+=vec3(.10,.22,.34)*max(0.,twilight)*.55;float rim=pow(1.-max(0.,dot(n,normalize(cameraPosition))),3.2);c+=vec3(.02,.12,.35)*rim;gl_FragColor=vec4(c,1.);}`});
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,128,128),earthMat);earthGroup.add(earth);
const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.013,96,96),new THREE.MeshPhongMaterial({map:cloudsTex,transparent:true,opacity:.36,depthWrite:false,blending:THREE.NormalBlending}));earthGroup.add(clouds);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.045,96,96),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,blending:THREE.AdditiveBlending,vertexShader:`varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 n;void main(){float a=pow(1.-max(0.,dot(n,vec3(0.,0.,1.))),3.0);gl_FragColor=vec4(.10,.38,1.,a*.58);}`}));earthGroup.add(atmosphere);
const starsGeo=new THREE.BufferGeometry(),pts=[];for(let i=0;i<5500;i++){let r=18,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);pts.push(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))}starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xc8d9ef,size:.018,transparent:true,opacity:.72,sizeAttenuation:true})));
const sunLight=new THREE.DirectionalLight(0xffffff,1.5);scene.add(sunLight);scene.add(new THREE.AmbientLight(0x314663,.09));
const eqGroup=new THREE.Group(),stormGroup=new THREE.Group();earthGroup.add(eqGroup,stormGroup);
const clickable=[];function latLon(lat,lon,r=1.028){const a=lat*Math.PI/180,b=lon*Math.PI/180;return new THREE.Vector3(Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)).multiplyScalar(r)}
function quakeMarker(f){const [lon,lat,depth]=f.geometry.coordinates;const mag=f.properties.mag||1;const g=new THREE.Group();g.position.copy(latLon(lat,lon,1.026));const s=Math.max(.010,Math.min(.038,.006+mag*.006));const dot=new THREE.Mesh(new THREE.SphereGeometry(s,16,16),new THREE.MeshBasicMaterial({color:0xffb765}));g.add(dot);g.userData={kind:'quake',lat,lon,depth,mag,place:f.properties.place,time:f.properties.time,url:f.properties.url,id:f.id};eqGroup.add(g);clickable.push(g)}
function stormMarker(lat,lon,temp,wind,code){const g=new THREE.Group();g.position.copy(latLon(lat,lon,1.03));const dot=new THREE.Mesh(new THREE.SphereGeometry(.022,16,16),new THREE.MeshBasicMaterial({color:0x73ddff}));g.add(dot);const ring=new THREE.Mesh(new THREE.RingGeometry(.035,.050,32),new THREE.MeshBasicMaterial({color:0x6edcff,transparent:true,opacity:.7,side:THREE.DoubleSide}));ring.rotation.x=Math.PI/2;g.add(ring);g.userData={kind:'storm',lat,lon,temp,wind,code};stormGroup.add(g);clickable.push(g)}
function clear(g){while(g.children.length)g.remove(g.children[0]);}
async function loadQuakes(){try{const r=await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',{cache:'no-store'});const j=await r.json();clear(eqGroup);clickable.length=0;j.features.forEach(quakeMarker);document.querySelector('#eqCount').textContent=j.features.length;return true}catch(e){return false}}
const grid=[];for(let lat=-60;lat<=60;lat+=20)for(let lon=-180;lon<180;lon+=30)grid.push([lat,lon]);
function weatherName(c){return c>=95?'THUNDERSTORM':c===0?'CLEAR':c<=3?'CLOUDY':'WEATHER'}
async function loadWeather(){try{const lats=grid.map(x=>x[0]).join(',');const lons=grid.map(x=>x[1]).join(',');const u=`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=weather_code,temperature_2m,wind_speed_10m&timezone=UTC`;const r=await fetch(u,{cache:'no-store'});const a=await r.json();clear(stormGroup);let n=0;(Array.isArray(a)?a:[a]).forEach((x,i)=>{const c=x.current?.weather_code;if(c>=95){stormMarker(grid[i][0],grid[i][1],x.current.temperature_2m,x.current.wind_speed_10m,c);n++}});document.querySelector('#stormCount').textContent=n;return true}catch(e){return false}}
async function refresh(){const [a,b]=await Promise.all([loadQuakes(),loadWeather()]);document.querySelector('#dataStatus').textContent=a&&b?'CONNECTED':'PARTIAL';document.querySelector('#dataStatus').className=a&&b?'ok':'';document.querySelector('#updated').textContent='LIVE DATA · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' UTC'}
function solar(){const now=new Date();const y=now.getUTCFullYear(),start=Date.UTC(y,0,0),dayN=Math.floor((now.getTime()-start)/86400000);const decl=23.44*Math.sin((2*Math.PI/365)*(dayN-81))*Math.PI/180;const utc=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600;const lon=(12-utc)*15*Math.PI/180;const v=new THREE.Vector3(Math.cos(decl)*Math.cos(lon),Math.sin(decl),Math.cos(decl)*Math.sin(lon)).normalize();earthMat.uniforms.sunDir.value.copy(v);sunLight.position.copy(v).multiplyScalar(5)}
let audio=null,master=null;function startAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=.028;master.connect(audio.destination);const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sine';o.frequency.value=47;f.type='lowpass';f.frequency.value=150;g.gain.value=.55;o.connect(f).connect(g).connect(master);o.start();const l=audio.createOscillator(),lg=audio.createGain();l.frequency.value=.06;lg.gain.value=8;l.connect(lg).connect(o.frequency);l.start();const o2=audio.createOscillator(),g2=audio.createGain();o2.type='triangle';o2.frequency.value=94;g2.gain.value=.025;o2.connect(g2).connect(master);o2.start()}
document.querySelector('#enter').onclick=()=>{startAudio();document.querySelector('#intro').style.opacity=0;setTimeout(()=>document.querySelector('#intro').remove(),700)};document.querySelector('#sound').onclick=()=>{if(!audio){startAudio();return}master.gain.value=master.gain.value>.001?0:.028};
function reset(){earthGroup.rotation.set(0,0,0);zoom=1;earthGroup.scale.setScalar(zoom)}document.querySelector('#reset').onclick=reset;
// Custom globe controls: page never moves; only the globe transforms.
const pointers=new Map();let lastMid=null,lastDist=0,lastTap=0,moved=false;
function pos(e){return{x:e.clientX,y:e.clientY}}
function rotate(dx,dy){earthGroup.rotation.y+=dx*.006;earthGroup.rotation.x+=dy*.006;earthGroup.rotation.x=Math.max(-1.48,Math.min(1.48,earthGroup.rotation.x))}
function setZoom(z){zoom=Math.max(.58,Math.min(4.8,z));earthGroup.scale.setScalar(zoom);document.querySelector('#updated').textContent='ZOOM · '+zoom.toFixed(1)+'× · LIVE DATA'}
canvas.addEventListener('pointerdown',e=>{startAudio();pointers.set(e.pointerId,pos(e));canvas.setPointerCapture(e.pointerId);moved=false});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,pos(e));if(pointers.size===1){rotate(e.clientX-old.x,e.clientY-old.y);moved=true}else if(pointers.size===2){const ps=[...pointers.values()],a=ps[0],b=ps[1],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},dist=Math.hypot(a.x-b.x,a.y-b.y);if(lastMid){rotate(mid.x-lastMid.x,mid.y-lastMid.y)}if(lastDist){setZoom(zoom*(dist/lastDist))}lastMid=mid;lastDist=dist;moved=true}});
canvas.addEventListener('pointerup',e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2){lastMid=null;lastDist=0}if(!moved&&p){pick(e.clientX,e.clientY)} });canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);lastMid=null;lastDist=0});
canvas.addEventListener('wheel',e=>{e.preventDefault();startAudio();setZoom(zoom*Math.exp(-e.deltaY*.0015))},{passive:false});
const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();function pick(x,y){mouse.x=x/innerWidth*2-1;mouse.y=-(y/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(clickable,true);if(!hits.length){hideInfo();return}let o=hits[0].object;while(o&&!o.userData.kind)o=o.parent;showInfo(o.userData)}
function showInfo(d){const info=document.querySelector('#info');let html='';if(d.kind==='quake'){const when=new Date(d.time).toLocaleString('de-DE');html=`<div class="infoHead"><div><div class="infoType">SEISMIC EVENT</div><div class="infoTitle">M ${Number(d.mag).toFixed(1)}</div></div><span class="close" id="close">×</span></div><div>${d.place||'Earthquake'}</div><div class="infoGrid"><span>DEPTH <b>${Number(d.depth).toFixed(1)} km</b></span><span>TIME <b>${when}</b></span><span>LAT <b>${d.lat.toFixed(2)}°</b></span><span>LON <b>${d.lon.toFixed(2)}°</b></span></div><a class="infoLink" href="${d.url}" target="_blank" rel="noopener">OPEN USGS EVENT ↗</a>`}else{html=`<div class="infoHead"><div><div class="infoType">STORM CELL</div><div class="infoTitle">${weatherName(d.code)}</div></div><span class="close" id="close">×</span></div><div class="infoGrid"><span>TEMP <b>${Number(d.temp).toFixed(1)} °C</b></span><span>WIND <b>${Number(d.wind).toFixed(0)} km/h</b></span><span>LAT <b>${d.lat.toFixed(1)}°</b></span><span>LON <b>${d.lon.toFixed(1)}°</b></span></div><div style="margin-top:8px;color:#718198">LIVE WEATHER CELL · OPEN-METEO</div>`}info.innerHTML=html;info.classList.add('show');document.querySelector('#close').onclick=hideInfo}
function hideInfo(){document.querySelector('#info').classList.remove('show')}
function updateCoords(){const v=new THREE.Vector3(0,0,1).applyQuaternion(earthGroup.quaternion).normalize();const lat=Math.asin(v.y)*180/Math.PI;const lon=Math.atan2(v.x,v.z)*180/Math.PI;document.querySelector('#coords').textContent=`${Math.abs(lat).toFixed(1)}° ${lat>=0?'N':'S'} · ${Math.abs(lon).toFixed(1)}° ${lon>=0?'E':'W'}`}
function tick(){const now=new Date();document.querySelector('#clock').textContent=now.toISOString().slice(11,19);solar();clouds.rotation.y+=.00035;earthMat.uniforms.time.value=performance.now()/1000;updateCoords();renderer.render(scene,camera);requestAnimationFrame(tick)}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
refresh();setInterval(refresh,60000);tick();
</script>
</body></html>
