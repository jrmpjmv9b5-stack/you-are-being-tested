name: Hannover Wetter

on:
  push:
    branches: [main]
    paths:
      - 'hannover-weather/**'
      - '.github/workflows/hannover-weather-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hannover-weather/package.json

      - name: Abhängigkeiten installieren
        working-directory: hannover-weather
        run: npm install

      - name: Anwendung bauen
        working-directory: hannover-weather
        run: npm run build

      - name: Pages-Seite zusammenstellen
        run: |
          rm -rf _site
          mkdir -p _site/hannover-weather
          cp -R hannover-weather/dist/. _site/hannover-weather/
          if [ -f index.html ]; then cp index.html _site/index.html; fi
          touch _site/.nojekyll

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
