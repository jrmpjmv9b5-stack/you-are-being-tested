name: Hannover Wetter
on:
  push:
    branches: [main]
    paths:
      - 'hannover-weather/**'
      - '.github/workflows/hannover-weather-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hannover-weather/package.json
      - name: Install
        working-directory: hannover-weather
        run: npm install
      - name: Build
        working-directory: hannover-weather
        run: npm run build
      - name: Assemble Pages site
        run: |
          mkdir -p _site/hannover-weather
          cp -R hannover-weather/dist/. _site/hannover-weather/
          if [ -f index.html ]; then cp index.html _site/index.html; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
